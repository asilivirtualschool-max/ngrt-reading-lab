<title>NGRT Reading Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: a reading-room workbench — cool paper ground, ink-blue type, highlighter yellow marks the thing being read or decided. */
:root{
  --paper:#f3f5f9; --surface:#ffffff; --sunk:#e9edf4; --ink:#16203a; --muted:#596379; --line:#d9dee8;
  --accent:#2747d4; --accent-ink:#ffffff; --accent-soft:#e4e9fc; --hl:#ffd94a; --hl-soft:#fff4c2; --hl-ink:#3d3000;
  --good:#1e7f55; --good-soft:#dff3e8; --warn:#a86a12; --warn-soft:#fbefd9; --crit:#bf3b28; --crit-soft:#fbe3df; --info:#2c62a8; --info-soft:#e1ecf9;
  --gold:#c99a1b; --silver:#8b95a7; --bronze:#b26b3b;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --r-lg:16px; --shadow:0 1px 2px rgba(22,32,58,.06), 0 6px 20px rgba(22,32,58,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1321; --surface:#161d2f; --sunk:#1d2539; --ink:#e7eaf3; --muted:#9aa3b9; --line:#2a334a;
  --accent:#7d95ff; --accent-ink:#0b1022; --accent-soft:#232d52; --hl:#e9c53b; --hl-soft:#3a3315; --hl-ink:#fff6cf;
  --good:#53c08d; --good-soft:#163527; --warn:#e0a548; --warn-soft:#3a2c14; --crit:#f07a66; --crit-soft:#3e1d19; --info:#7fb0f0; --info-soft:#18294a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e1321; --surface:#161d2f; --sunk:#1d2539; --ink:#e7eaf3; --muted:#9aa3b9; --line:#2a334a;
  --accent:#7d95ff; --accent-ink:#0b1022; --accent-soft:#232d52; --hl:#e9c53b; --hl-soft:#3a3315; --hl-ink:#fff6cf;
  --good:#53c08d; --good-soft:#163527; --warn:#e0a548; --warn-soft:#3a2c14; --crit:#f07a66; --crit-soft:#3e1d19; --info:#7fb0f0; --info-soft:#18294a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid>*,.row>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.panel.flat{box-shadow:none}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
hr.rule{border:0;border-top:1px solid var(--line);margin:4px 0}

/* buttons & inputs */
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:.92rem;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.hl{background:var(--hl);border-color:var(--hl);color:#2b2200}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger.solid{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn.lg{padding:14px 22px;font-size:1.02rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.86rem}
label.f>span.hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px;font-family:var(--f-mono);font-size:.84rem;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;gap:8px;align-items:center;font-weight:400;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:700;font-size:.84rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.hl{background:var(--hl-soft);color:var(--hl-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* stanine strip */
.stn{display:inline-grid;grid-template-columns:repeat(9,14px);gap:2px;vertical-align:middle}
.stn i{height:14px;border-radius:3px;background:var(--sunk)}
.stn i.on.b1{background:var(--crit)} .stn i.on.b2{background:var(--warn)} .stn i.on.b3{background:var(--good)}
.stn-n{font-family:var(--f-mono);font-weight:700;margin-left:6px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.12rem;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.brand-mark span{display:block;width:16px;height:5px;background:var(--hl);border-radius:2px;box-shadow:0 -7px 0 -1px var(--paper),0 7px 0 -1px var(--paper)}
.spacer{flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:12px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-size:.9rem}
.tabs button.on{color:var(--ink);border-bottom-color:var(--hl)}
.tabs button:hover{color:var(--ink)}
main{padding-block:24px 60px}

/* landing */
.hero{padding-block:48px 24px;display:grid;gap:28px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:center}
.hero h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 .08em}
.hero .lede{font-size:1.08rem;color:var(--muted);max-width:56ch;margin-top:14px}
.door{display:flex;flex-direction:column;gap:6px;text-align:left;padding:22px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--accent);transform:translateY(-2px)}
.door b{font-family:var(--f-display);font-size:1.3rem}
.door span{color:var(--muted);font-size:.92rem}
.door .arrow{font-family:var(--f-mono);color:var(--accent);font-weight:700;margin-top:6px}
.specimen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.specimen .sent{font-size:1.25rem;line-height:1.6}
.gap{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--ink);text-align:center;font-weight:700;padding:0 .2em;line-height:1.2}
.gap.cur{background:var(--hl);color:#2b2200;border-bottom-color:#2b2200;border-radius:4px 4px 0 0}
.gap.filled{color:var(--accent)}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-block:28px 8px}}

/* KPIs */
.kpi{padding:16px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1.05}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:700}
.kpi.alert .v{color:var(--crit)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--sunk)}
.nowrap{white-space:nowrap}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(90px,160px) 1fr 52px;gap:10px;align-items:center;font-size:.86rem}
.bar-track{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:var(--accent)}
.bar-fill.good{background:var(--good)} .bar-fill.warn{background:var(--warn)} .bar-fill.crit{background:var(--crit)}
.bar-row .num{text-align:right;font-weight:700}

/* profile card */
.prof{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.prof-h{padding:18px 20px;display:flex;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prof-badge{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem;flex-shrink:0}
.tone-good{background:var(--good-soft);color:var(--good)} .tone-warn{background:var(--warn-soft);color:var(--warn)}
.tone-crit{background:var(--crit-soft);color:var(--crit)} .tone-info{background:var(--info-soft);color:var(--info)}
.prof-b{padding:18px 20px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.prof-b ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.src{font-size:.76rem;color:var(--muted);padding:10px 20px;border-top:1px solid var(--line);background:var(--sunk)}

/* test runner */
.run{max-width:1120px;margin:0 auto}
.run-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0}
.pips{display:inline-flex;gap:4px;align-items:center}
.pips i{width:22px;height:8px;border-radius:4px;background:var(--sunk)}
.pips i.on{background:var(--accent)} .pips i.cur{background:var(--hl);box-shadow:0 0 0 2px var(--ink) inset}
.timer{font-family:var(--f-mono);font-weight:700;padding:6px 12px;border-radius:8px;background:var(--sunk);font-variant-numeric:tabular-nums}
.timer.low{background:var(--crit-soft);color:var(--crit)}
.qbar{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.qbar>div{height:100%;background:var(--warn);transition:width .25s linear}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;font-size:1.02rem;line-height:1.85;max-height:calc(100vh - 220px);overflow:auto}
.passage p{margin:0 0 .9em}
.passage h4{margin:1em 0 .3em;font-size:1.02rem}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:18px}
.qstem{font-size:1.18rem;line-height:1.6}
.sc-stem{font-size:1.45rem;line-height:1.7}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 15px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:1.02rem;font-weight:700;transition:border-color .12s,background .12s}
.opt .key{font-family:var(--f-mono);font-size:.8rem;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);flex-shrink:0}
.opt.multi .key{border-radius:50%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.opt:disabled{cursor:default}
.multi-note{display:inline-flex;gap:8px;align-items:center;background:var(--hl-soft);color:var(--hl-ink);padding:6px 12px;border-radius:8px;font-weight:700;font-size:.88rem;align-self:flex-start}
.fb{padding:14px 16px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--crit-soft);color:var(--crit)} .fb.part{background:var(--warn-soft);color:var(--warn)}
.fb p{color:var(--ink);margin-top:4px}
[hidden]{display:none!important}
.welcome{max-width:760px;padding-top:56px;padding-bottom:56px;display:flex;flex-direction:column;gap:22px}
.w-brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.w-dot{width:22px;height:22px;border-radius:7px;background:var(--hl)}
.w-h1{font-family:var(--f-display);font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.08;letter-spacing:-.02em;margin:28px 0 0}
.w-h1 mark{background:var(--hl);color:var(--hl-ink);padding:0 .14em;border-radius:8px}
.w-lede{font-size:1.2rem;color:var(--muted);max-width:40ch;margin:0}
.w-doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:12px}
.w-door{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.w-door svg{color:var(--accent)} .w-door h2{margin:0} .w-door p{color:var(--muted);margin:0}
.w-link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:1.05rem;cursor:pointer;margin-top:6px}
.w-link:hover{text-decoration:underline} .w-link.sm{font-size:inherit;margin:0}
.w-more{margin:4px 0 0}
.why{border:1px solid var(--accent);border-radius:14px;overflow:hidden;background:var(--accent-soft)}
.why-h{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 16px;font-size:.92rem}
.why-opts{display:grid;gap:8px}
.why-opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;font-size:.92rem;color:var(--ink)}
.why-opt:hover{border-color:var(--accent)} .why-opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.why-opt.right{border-color:var(--good);background:var(--good-soft)} .why-opt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.tap-sent{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:2.1}
.tap-w{background:none;border:0;border-bottom:2px dotted var(--line);padding:0 2px;font:inherit;color:var(--ink);cursor:pointer}
.tap-w.on{background:var(--hl);color:var(--hl-ink);border-bottom-color:var(--hl);border-radius:4px}
.tap-gap{background:var(--ink);color:var(--surface);padding:2px 10px;border-radius:6px}
.why-fb{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin-top:10px;color:var(--ink)}
.why-fb p{margin:4px 0} .why-fb mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}
.think{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.think summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none} .think summary::-webkit-details-marker{display:none}
.t-av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.think ol{margin:8px 0 2px 40px;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.book{display:flex;flex-direction:column;gap:10px}
.book-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.book-text.poem p{line-height:1.9}
.book-text .s{cursor:pointer;border-radius:4px;transition:background .15s} .book-text .s:hover{background:var(--sunk)} .book-text .s.on{background:var(--hl);color:var(--hl-ink)}
.pager{display:flex;justify-content:center;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pg{min-width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer} .pg.on{background:var(--ink);color:var(--surface)} .pg:disabled{opacity:.4;cursor:default}
.src-line{font-size:.78rem;color:var(--muted);margin:6px 0 0;line-height:1.45} .src-line.top{max-width:60ch}
.why textarea{font-family:var(--f-body);font-size:.95rem}
.train-h{background:var(--hl-soft);border-radius:var(--r-lg);padding:18px 20px;color:var(--ink)}
.why.wb .wb-sec{padding:14px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.why.wb .wb-sec:first-child{border-top:0}
.wb-lab{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.wb-help{margin:0;font-size:.85rem;font-style:italic;color:var(--muted)}
.wb-count{align-self:flex-start;background:var(--hl-soft);color:var(--hl-ink);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600}
.clue-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.clue-chip .chip-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.clue-chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)} .clue-chip.on .chip-dot{background:var(--accent-ink)}

.stagerail button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)} .stagerail button.done{border-color:var(--good);color:var(--good)} .stagerail button.done[aria-current="true"]{background:var(--good);color:#fff}
.lab-text{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--mc);border-radius:0 12px 12px 0;padding:16px 18px;margin:12px 0}

.lp-hero{padding-block:44px 18px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.lp-hero h1{font-size:clamp(2.2rem,5.5vw,3.6rem)}
.lp-hero .lede{font-size:1.12rem;color:var(--muted);max-width:62ch}
.lp-sec{display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;padding-block:34px;border-bottom:1px solid var(--line)}
.lp-num{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--accent)}
.lp-body{display:flex;flex-direction:column;gap:16px;min-width:0}
.lp-body>p{max-width:68ch}
.lp-split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.formula{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.formula .term{flex:1 1 180px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.formula .term b{font-family:var(--f-display);font-size:1.15rem}
.formula .term span{color:var(--muted);font-size:.86rem}
.formula .term.res{background:var(--hl-soft);border-color:var(--hl)}
.formula .term.res b,.formula .term.res span{color:var(--hl-ink)}
.formula .op{font-family:var(--f-display);font-weight:800;font-size:1.8rem;display:grid;place-items:center;color:var(--muted)}
.note-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.05}
.stat span{color:var(--muted);font-size:.86rem}
.caveat{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.caveat b{color:var(--ink)}
a.cite{font-family:var(--f-mono);font-size:.74em;font-weight:700;text-decoration:none;white-space:nowrap;position:relative;top:-.45em;margin-left:1px}
a.cite:hover{text-decoration:underline}
.lp-cta{padding-block:30px;display:flex;flex-direction:column;gap:16px}
.lp-src{padding-block:10px 20px;font-size:.84rem;color:var(--muted)}
.lp-src ol{margin:10px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){.lp-sec{grid-template-columns:1fr;gap:8px}.lp-split{grid-template-columns:1fr}.formula .op{width:100%;font-size:1.3rem}}

/* ================= SEED QUESTION BANK ================= */
// SC items: {strand:'SC', level, skill, stem (use ___ for the gap), options[], answers[idx], explanation}
// PC passages: {title, level, text} with items {strand:'PC', passage, gap?, ...}
const SEED_SET = "NGRT Starter Bank";

  // Level 1
  {level:1, skill:"Vocabulary", stem:"The cat curled up on the ___ by the fire.", options:["mat","sky","run","happy","under"], answers:[0], explanation:"A cat curls up on something soft on the floor: a mat. The gap needs a thing (noun)."},

  {level:3, skill:"Grammar", stem:"The ___ of the valley grew crops to sell in the village.", options:["inhabitants","informers","residential","farming","inhibitors"], answers:[0], explanation:"The gap needs a noun for people: inhabitants are the people who live there."},
  {level:3, skill:"Vocabulary", stem:"After the marathon, Priya felt ___ but proud.", options:["exhausted","weary","energetic","idle","careless"], answers:[0,1], explanation:"'But proud' sets up a contrast with how her body felt: exhausted and weary both mean very tired."},
  // Level 4
  {level:4, skill:"Grammar", stem:"___ the statue, the Mayor praised the work of the sculptor.", options:["Recoiling","Reviling","Revealing","Receding","Revelling"], answers:[2], explanation:"Statues are revealed (unveiled) at ceremonies, and praising the sculptor follows logically."},

  { key:"code", title:"In Code", level:5,
    text:"Communicating is all about getting the message across as effectively as possible, isn't it? For centuries, [1], we have been coming up with ingenious ways of making communication difficult, to [2] access to information. That's where codes come in. But [3] did it all start?\n\nEarly codes\nCenturies ago, the Greeks are known to have created a substitution code, using numbers for letters. Another early code is attributed to Julius Caesar. Having established himself as a dictator in Rome, he used ciphers to communicate with his armies, aware of potential rebellions against him. Each letter in a message was replaced by another letter in the alphabet, which hampered his enemies, as long as his own men remembered how to decipher the code, of course!\n\nCodeword: Treason\nComing at this from the opposite direction, Mary, Queen of Scots, used a code to communicate with fellow conspirators in her attempts to end Elizabeth I's reign. However, the skills of cryptanalysis had developed by this point, making it relatively easy for code-breakers to decipher the hapless Mary's messages. After Mary's code was deciphered and her plot uncovered she was found guilty of treason and sentenced to death.\n\nCode breakers\nThe most famous code-breaking effort in history took place during the Second World War. Brilliant mathematicians worked at Bletchley Park, where they played a key role in cracking the German Enigma code. Their elaborate efforts, using some of the earliest computing machines, are widely regarded as having helped to shorten the war significantly.",

      {skill:"Text structure", stem:"How has the information in this text been organised?", options:["non-chronologically","chronologically","by cause and effect","by compare and contrast","as a list of instructions"], answers:[1], explanation:"It moves in time order: Greeks, Caesar, Mary Queen of Scots, the Second World War."},
      {skill:"Inference", stem:"Which statements about Mary, Queen of Scots are true?", options:["She used a code to plot against Elizabeth I","Her code was broken by code-breakers","She invented the substitution code","She worked at Bletchley Park","Her code helped shorten the war"], answers:[0,1], explanation:"The 'Codeword: Treason' paragraph says she plotted in code and her messages were deciphered."},

      {skill:"Language techniques", stem:"Which technique does the poet use most often?", options:["similes: comparing things using 'like'","rhyme at the end of every line","questions to the reader","a repeated chorus"], answers:[0], explanation:"Almost every line compares something on the beach to something else using 'like'. The poem doesn't rhyme."},
      {skill:"Inference", stem:"The seagulls' cries are compared to a sound most people find very unpleasant. What does this tell you about the seagulls?", options:["They are loud and harsh","They are quiet and gentle","They are singing sweetly","They are far away"], answers:[0], explanation:"Choosing an unpleasant sound for the comparison shows how sharp and noisy the gulls are."},
      {skill:"Vocabulary in context", stem:"The poem uses the te reo Māori word 'moana'. What does it mean?", options:["sea or ocean","sand","sky","shell"], answers:[0], explanation:"Moana means sea. In the poem it crashes, which also fits the sea."},
      {skill:"Text structure", stem:"How does the poem change in its last few lines?", options:["It moves from describing the beach to the poet's own hope that the place will stay the same","It turns into a set of instructions","It starts to rhyme","It describes a storm"], answers:[0], explanation:"The ending slows down: she walks away at sunset, looking back and hoping the 'magical place' won't change."},

    ]},
  { key:"odeteeth", title:"Ode to Teeth", level:3, genre:"Poem",
    src:{ by:"Nick Ascroft", series:"School Journal", issue:"Years 5–6, November 2025", pages:"page 20", year:"Year 6", audio:false, url:"",
      credit:"“Ode to Teeth” by Nick Ascroft. Published in School Journal Years 5–6, November 2025, by the New Zealand Ministry of Education. Text copyright © Crown 2025." },
    intro:"A funny poem all about teeth: what they do, the different kinds, and how to look after them. Read it aloud. It is meant to be heard.",

      {skill:"Retrieval", stem:"Which TWO of these are types of teeth named in the poem?", options:["molars","incisors","braces","gums","tonsils"], answers:[0,1], explanation:"The poem names molars and incisors (and fangs and wisdom teeth). Braces, gums and tonsils aren't teeth."},
      {skill:"Language techniques", stem:"Some lines repeat a sound word over and over. What is this technique called?", options:["onomatopoeia","personification","simile","alliteration of vowels"], answers:[0], explanation:"Sound words that imitate the noise they describe are onomatopoeia. Repeating them makes the poem fun to read aloud."},
      {skill:"Text structure", stem:"How is the poem built?", options:["Short lines in rhyming pairs, arranged in verses","One long paragraph","A conversation between two characters","Numbered steps"], answers:[0], explanation:"The lines rhyme in pairs and are grouped into verses, which gives it a bouncy rhythm."},
      {skill:"Inference", stem:"Which detail is a joke rather than a true fact about human teeth?", options:["Fangs are for sucking blood","Molars are good for chewing","Wisdom teeth come through later than other teeth","You need your teeth to say F and V"], answers:[0], explanation:"Human teeth aren't for sucking blood. The poet mixes real facts with silly ones to make readers laugh."},

  { key: "seeds", title: "Sam's Seeds", level: 1, genre: "Story", src: SRC_ORIGINAL,
    text: "Sam had a small packet of sunflower seeds. Gran gave him a pot full of soil.\n\nSam pushed three seeds into the soil. He gave them a drink of water and put the pot by the window.\n\nEvery morning Sam looked at the pot. Nothing happened. \"Seeds are slow,\" said Gran. \"Be patient.\"\n\n===\n\nOn the fifth day, Sam saw a tiny green shoot. On the sixth day there were two more!\n\nSam watered them every day. The shoots grew taller and taller.\n\nBy the end of the summer, three tall sunflowers stood by the back door. They were even taller than Gran! Sam smiled. \"Slow seeds can grow big,\" he said.",
    items: [
      { skill: "Retrieval", stem: "What did Gran give Sam?", options: ["a pot full of soil", "a packet of seeds", "a watering can", "a new book"], answers: [0], explanation: "\"Gran gave him a pot full of soil.\" Sam already had the seeds.", mis: { 1: "wt", 2: "nt", 3: "nt" } },
      { skill: "Retrieval", stem: "Where did Sam put the pot?", options: ["by the window", "by the back door", "under his bed", "in the garden"], answers: [0], explanation: "\"He ... put the pot by the window.\" The sunflowers stood by the back door later.", mis: { 1: "wt", 2: "nt", 3: "nt" } },
      { skill: "Retrieval", stem: "Which TWO things did Sam do to look after the seeds?", options: ["gave them water", "put them by the window", "sang to them", "put them in the fridge", "dug a big hole"], answers: [0, 1], explanation: "He gave them a drink of water and put the pot by the window.", mis: { 2: "nt", 3: "nt", 4: "nt" } },
      { skill: "Inference", stem: "Why did Gran say \"Be patient\"?", options: ["Seeds take time to grow.", "Sam was being too noisy.", "The seeds were broken.", "It was going to rain."], answers: [0], explanation: "She had just said \"Seeds are slow.\" Sam had to wait for them to grow.", mis: { 1: "nt", 2: "nt", 3: "nt" } },
      { skill: "Vocabulary in context", stem: "\"Nothing happened.\" What does this mean here?", options: ["No shoots had grown yet.", "Sam forgot about the pot.", "The pot fell over.", "Gran took the pot away."], answers: [0], explanation: "Sam looked every morning but could not see anything growing yet.", mis: { 1: "ctx", 2: "nt", 3: "nt" } },
      { skill: "Summarising", stem: "Which sentence best sums up the story?", options: ["Sam plants seeds, waits patiently, and they grow into tall sunflowers.", "Sam waters a pot every morning.", "Gran grows sunflowers by herself.", "Sam buys seeds at a shop."], answers: [0], explanation: "The story is about planting, waiting and the seeds growing big.", mis: { 1: "det", 2: "wt", 3: "nt" } },

    text: "Who has seen the wind?\nNeither I nor you:\nBut when the leaves hang trembling,\nThe wind is passing through.\n\nWho has seen the wind?\nNeither you nor I:\nBut when the trees bow down their heads,\nThe wind is passing by.",

      { skill: "Inference", stem: "Why does the poem say that nobody has seen the wind?", options: ["Wind is moving air, which we cannot see.", "The wind only comes at night.", "The wind hides behind the trees.", "People close their eyes when it is windy."], answers: [0], explanation: "We can't see moving air, only what it does to leaves and trees.", mis: { 1: "nt", 2: "lit", 3: "nt" } },

  { key: "lionmouse", title: "The Lion and the Mouse", level: 2, genre: "Fable",
    src: { kind: "retold", credit: "Retold for NGRT Reading Lab (2026) from the Aesop fable \"The Lion and the Mouse\" (traditional, public domain). This retelling is original." },
    text: "A great lion lay asleep in the sun. A little mouse came running along and, by mistake, ran right across the lion's nose.\n\nThe lion woke with a roar. He caught the mouse under his huge paw.\n\n\"Please let me go!\" squeaked the mouse. \"If you spare me, one day I will help you.\"\n\nThe lion laughed. \"How could a tiny mouse ever help a lion?\" But he lifted his paw, and the mouse ran away.\n\n===\n\nA few days later, the lion was walking through the forest when he stepped into a hunter's trap. A net of thick ropes fell over him. The more he pulled, the tighter the ropes became. He roared and roared, but he could not get free.\n\nThe little mouse heard the roaring and ran to help. She began to gnaw the ropes with her sharp teeth. One by one, the ropes snapped, until the lion could climb out.\n\n\"You laughed at me,\" said the mouse, \"but now you see that even a little friend can be a great help.\"\n\nMoral: Kindness is never wasted, and the small can help the great.",
    items: [
      { skill: "Retrieval", stem: "How did the mouse wake the lion?", options: ["It ran across his nose.", "It bit his tail.", "It squeaked in his ear.", "It pulled on a rope."], answers: [0], explanation: "\"by mistake, ran right across the lion's nose.\"", mis: { 1: "nt", 2: "wt", 3: "wt" } },
      { skill: "Inference", stem: "Why did the lion laugh at the mouse?", options: ["He did not believe something so small could help him.", "The mouse told him a joke.", "He was happy to have caught his dinner.", "The mouse was tickling him."], answers: [0], explanation: "\"How could a tiny mouse ever help a lion?\" shows he thought it was impossible.", mis: { 1: "srf", 2: "nt", 3: "nt" } },
      { skill: "Retrieval", stem: "What trapped the lion?", options: ["a net of thick ropes", "a deep hole", "a metal cage", "a fallen tree"], answers: [0], explanation: "\"A net of thick ropes fell over him.\"", mis: { 1: "nt", 2: "nt", 3: "nt" } },

  { key: "nightmarket", title: "The Night Market", level: 3, genre: "Story", src: SRC_ORIGINAL,
    text: "Every Thursday evening, the empty car park behind Layla's building became a night market. By six o'clock the stallholders had put up their lights, and the smell of grilled corn and spiced tea [1] through the warm air.\n\nLayla's job was to help her uncle Karim at his stall, which sold handmade lanterns. Uncle Karim was a quiet man, but his lanterns seemed to talk for him: tiny stars and moons were cut into the tin, so that when a candle was lit inside, the patterns spilled across the ground.\n\n===\n\nThat evening, a boy of about six stood in front of the stall for a long time. He did not touch anything. He just stared at the biggest lantern, a golden one shaped like a ship.\n\n\"That one is very expensive,\" Layla said, a little too quickly.\n\nThe boy nodded and turned away. Uncle Karim watched him go and said nothing, but Layla noticed the [2] on his face.\n\n===\n\nLater, when the crowds had thinned, Uncle Karim handed Layla a small tin lantern with a single star cut into it. \"Run,\" he said. \"He went towards the fruit stalls.\"\n\nLayla found the boy holding his mother's hand. She knelt down and gave him the lantern. \"It's not the ship,\" she said, \"but it shines just as far.\"\n\nThe boy's face lit up brighter than any lantern on the stall. When Layla got back, her uncle was smiling. \"Some things,\" he said, \"are worth more than what they cost.\"",

      { skill: "Retrieval", stem: "What did Uncle Karim's stall sell?", options: ["handmade lanterns", "grilled corn", "spiced tea", "toy ships"], answers: [0], explanation: "\"his stall, which sold handmade lanterns.\" The corn and tea were other stalls.", mis: { 1: "wt", 2: "wt", 3: "srf" } },
      { skill: "Language techniques", stem: "\"his lanterns seemed to talk for him\" What does this mean?", options: ["His lanterns showed what he was like, even though he said little.", "The lanterns made sounds.", "He had a talking toy on his stall.", "He sold lanterns that played music."], answers: [0], explanation: "He was quiet, but the beautiful lanterns said a lot about him. This is figurative, not literal.", mis: { 1: "lit", 2: "lit", 3: "lit" } },

  { key: "railway", title: "From a Railway Carriage", level: 3, genre: "Poem",
    src: { kind: "public-domain", credit: "\"From a Railway Carriage\" by Robert Louis Stevenson (1850–1894), from A Child's Garden of Verses (1885). Public domain." },
    text: "Faster than fairies, faster than witches,\nBridges and houses, hedges and ditches;\nAnd charging along like troops in a battle,\nAll through the meadows the horses and cattle:\nAll of the sights of the hill and the plain\nFly as thick as driving rain;\nAnd ever again, in the wink of an eye,\nPainted stations whistle by.\n\nHere is a child who clambers and scrambles,\nAll by himself and gathering brambles;\nHere is a tramp who stands and gazes;\nAnd there is the green for stringing the daisies!\nHere is a cart run away in the road\nLumping along with man and load;\nAnd here is a mill and there is a river:\nEach a glimpse and gone for ever!",
    items: [

      { skill: "Language techniques", stem: "\"Faster than fairies, faster than witches\" Why does the poet repeat sounds and words in this line?", options: ["to create a quick, rushing rhythm like a moving train", "to show that fairies and witches are real", "to show that the train is moving slowly", "to make the poem longer"], answers: [0], explanation: "The quick, repeated beat sounds like a train racing along the track.", mis: { 1: "lit", 2: "opp", 3: "nt" } },
      { skill: "Vocabulary in context", stem: "\"Each a glimpse and gone for ever!\" What is a glimpse?", options: ["a very quick look", "a long stare", "a photograph", "a loud noise"], answers: [0], explanation: "Everything flashes past, so the speaker only sees each thing for a moment.", mis: { 1: "opp", 2: "ctx", 3: "ctx" } },
      { skill: "Inference", stem: "Why do the sights seem to \"fly\" past the speaker?", options: ["The train is moving very fast.", "There is a storm outside.", "The animals are running away.", "The speaker is dreaming."], answers: [0], explanation: "From a fast train, things outside seem to rush past.", mis: { 1: "lit", 2: "lit", 3: "nt" } },
      { skill: "Language techniques", stem: "\"charging along like troops in a battle\" This is an example of:", options: ["a simile", "a metaphor", "onomatopoeia", "a question"], answers: [0], explanation: "It compares the animals to troops using \"like\", so it is a simile.", mis: { 1: "dev", 2: "dev", 3: "dev" } },

    src: { kind: "original", credit: "Original text written for NGRT Reading Lab (2026). Facts checked against general reference sources on honeybees." },
    text: "A honeybee weighs about a tenth of a gram, yet a single hive can hold more than 40,000 of them working together. Each bee has a job, and together they build one of the most [1] structures in the animal world: the honeycomb.\n\nThe perfect shape\nHoneycomb is made of six-sided cells called hexagons. For centuries, people wondered why bees chose this shape. Mathematicians eventually showed that hexagons fit together with no gaps, and that they hold the most honey for the least amount of wax. Bees must eat around eight grams of honey to make one gram of wax, so saving wax saves a great deal of [2].\n\n===\n\nBuilding with their bodies\nYoung worker bees make wax from special glands on their abdomens. The wax comes out as tiny white flakes, which the bees chew until soft. They press it into place, using their own bodies to measure. Each new cell is checked and smoothed, so the walls are thin but strong.\n\nMore than a store cupboard\nNot every cell holds honey. The queen lays her eggs in some of them, and others store pollen, which the young bees eat. In hot weather, workers fan their wings over the comb to keep it cool, because wax that becomes too warm can soften and sag. A hive, then, is not just a home. It is a carefully managed factory, nursery and pantry all in one.",
    items: [
      { gap: 1, skill: "Cloze", stem: "Choose the word that best fits gap [1].", options: ["remarkable", "remark", "remarkably", "ordinary", "removable"], answers: [0], explanation: "\"one of the most ___ structures\" needs an adjective that praises the honeycomb: remarkable.", mis: { 1: "wc", 2: "wc", 3: "opp", 4: "lka" } },
      { gap: 2, skill: "Cloze", stem: "Choose the word that best fits gap [2].", options: ["honey", "money", "space", "wings", "noise"], answers: [0], explanation: "Bees use eight grams of honey to make one gram of wax, so using less wax saves honey.", mis: { 1: "srf", 2: "shd", 3: "sns", 4: "sns" } },
      { skill: "Retrieval", stem: "Why are hexagons a good shape for honeycomb?", options: ["They fit together with no gaps and hold the most honey for the least wax.", "They are the easiest shape to draw.", "They help bees fly faster.", "The queen likes them best."], answers: [0], explanation: "\"hexagons fit together with no gaps, and ... hold the most honey for the least amount of wax.\"", mis: { 1: "nt", 2: "nt", 3: "nt" } },
      { skill: "Retrieval", stem: "Apart from honey, which TWO things are kept in the cells?", options: ["eggs", "pollen", "drinking water", "sleeping bees"], answers: [0, 1], explanation: "\"The queen lays her eggs in some of them, and others store pollen.\"", mis: { 2: "nt", 3: "nt" } },
      { skill: "Inference", stem: "Why do worker bees fan their wings in hot weather?", options: ["to stop the wax getting too warm and sagging", "to make the honey sweeter", "to fly away from the hive", "to dry the eggs"], answers: [0], explanation: "\"to keep it cool, because wax that becomes too warm can soften and sag.\"", mis: { 1: "nt", 2: "srf", 3: "nt" } },

    ] },
  { key: "lighthouse", title: "The Keeper's Daughter", level: 4, genre: "Story", src: SRC_ORIGINAL,
    text: "The storm arrived faster than the forecast had promised. By late afternoon the sea around Gull Rock had turned the colour of slate, and waves were throwing themselves against the lighthouse as if they meant to knock it down.\n\nMara's father had rowed to the mainland that morning for supplies. \"Back by four,\" he had said. It was now half past five, and the boat had not returned.\n\n===\n\nAt six, the light should have been switched on. Mara had watched her father do it a hundred times, but she had never done it herself. The lamp room was at the top of ninety-two steps, and the wind screamed through every crack in the stone.\n\nHer hands were shaking as she found the switch. Nothing happened. The power had gone.\n\nFor a moment Mara stood frozen. Then she remembered the old paraffin lamp in the storeroom, the one her father kept \"just in case\". She carried it up all ninety-two steps, filled it, and struck a match. The first one blew out. So did the second. The third caught.\n\n===\n\nThe flame was small, but the great glass lens around it gathered the light and sent it sweeping out across the water.\n\nSome time after midnight, the storm began to tire. At dawn, Mara saw a small boat crawling towards the rock, its oars moving slowly. Her father climbed out, soaked and exhausted. He had spent the night sheltering in a cove, steering by the beam of light.\n\nHe looked up at the tower, then at his daughter. He did not say anything at first. He did not need to.",
    items: [
      { skill: "Retrieval", stem: "Why was Mara alone at the lighthouse?", options: ["Her father had rowed to the mainland for supplies.", "Her father was asleep in the storeroom.", "She had run away from home.", "Her father was fixing the power."], answers: [0], explanation: "\"Mara's father had rowed to the mainland that morning for supplies.\"", mis: { 1: "wt", 2: "nt", 3: "nt" } },
      { skill: "Language techniques", stem: "\"waves were throwing themselves against the lighthouse\" This is an example of:", options: ["personification", "a simile", "onomatopoeia", "a fact"], answers: [0], explanation: "Waves can't choose to throw themselves: the writer gives them a human action.", mis: { 1: "dev", 2: "dev", 3: "fmt" } },

      { skill: "Retrieval", stem: "Which TWO problems did Mara have to solve?", options: ["The power had gone.", "The matches kept blowing out.", "The lamp room door was locked.", "The boat had a hole in it."], answers: [0, 1], explanation: "\"The power had gone.\" Then \"The first one blew out. So did the second.\"", mis: { 2: "nt", 3: "nt" } },
      { skill: "Inference", stem: "How did the light help Mara's father?", options: ["He used the beam to steer and stay safe through the night.", "It kept him warm in the boat.", "It woke him up in the morning.", "It showed him where to buy supplies."], answers: [0], explanation: "\"He had spent the night sheltering in a cove, steering by the beam of light.\"", mis: { 1: "lit", 2: "nt", 3: "nt" } },
      { skill: "Inference", stem: "\"He did not say anything at first. He did not need to.\" Why didn't he need to speak?", options: ["His face showed how proud and thankful he was.", "He was angry and did not want to talk.", "He had lost his voice in the storm.", "Mara could not hear him over the wind."], answers: [0], explanation: "She had kept the light going and saved him. His look said everything.", mis: { 1: "opp", 2: "lit", 3: "nt" } },
      { skill: "Evaluating", meaning: "critical", stem: "Which idea would the writer most likely agree with?", options: ["Thinking clearly can help you in an emergency.", "Children should never be left alone.", "Lighthouses are no longer needed.", "Storms always arrive when the forecast says."], answers: [0], explanation: "Mara stays calm, remembers the old lamp, and keeps trying until it lights.", mis: { 1: "ovr", 2: "nt", 3: "opp" } }
    ] },
  { key: "sleep", title: "Why We Sleep", level: 5, genre: "Information text",
    src: { kind: "original", credit: "Original text written for NGRT Reading Lab (2026). Facts checked against published sleep guidance, such as the American Academy of Sleep Medicine's recommendations." },
    text: "We spend roughly a third of our lives asleep. To a busy person, that can look like wasted time. [1], scientists now believe that sleep is one of the most active and important things the body does.\n\nCleaning and sorting\nWhile we sleep, the brain does not simply switch off. During deep sleep, fluid flows more freely through brain tissue, helping to clear away waste that builds up during the day. Meanwhile, the brain [2] through the day's experiences, strengthening some memories and discarding others. Students who sleep after learning something new often remember it better the next day than those who stay awake.\n\n===\n\nGrowing and repairing\nSleep is also when the body repairs itself. Growth hormone, which helps children grow and helps muscles recover, is released mainly during deep sleep. This is one reason why young people need more sleep than adults: experts recommend nine to twelve hours a night for children aged six to twelve.\n\n===\n\nThe cost of too little\nWhen people go without enough sleep, the effects add up. Concentration slips, reactions slow, and it becomes harder to control emotions. Over months and years, a lack of sleep has been linked to a greater risk of illness. Screens are part of the problem: the light from phones and tablets can delay the [3] that tells the body it is time to sleep.\n\nThe message from the research is clear. Sleep is not a luxury to be squeezed into whatever time is left over. It is a foundation for learning, health and happiness.",

      { gap: 2, skill: "Cloze", stem: "Choose the word that best fits gap [2].", options: ["sorts", "sort", "sorted", "sorting", "sights"], answers: [0], explanation: "\"the brain ___ through\" needs a present-tense verb that agrees with \"the brain\": sorts.", mis: { 1: "tns", 2: "tns", 3: "tns", 4: "lka" } },
      { gap: 3, skill: "Cloze", stem: "Choose the word that best fits gap [3].", options: ["signal", "single", "signature", "noise", "alarm"], answers: [0], explanation: "Light delays the body's signal that it is time to sleep. An alarm wakes you up.", mis: { 1: "lka", 2: "lka", 3: "sns", 4: "opp" } },

  if (x.meaning && MEANING[x.meaning]) return x.meaning;
  const it = x.itemId && typeof D !== "undefined" ? D.item(x.itemId) : null;
  if (it && it.meaning && MEANING[it.meaning]) return it.meaning;
  return MEANING_BY_SKILL[x.skill] || "inferential";
}

/* ---------- data-driven suggestions for one student ---------- */
function profileSuggestions(s, atts) {
  const out = [], rs = atts.flatMap(a => a.sess.responses);
  const k = profileKey(s.sc, s.pc);
  if (!atts.length) { out.push({ t: "Set a first practice test", d: k ? `The recommended test for this profile is “${PROFILE_PLUS[k].test.title}”. ${PROFILE_PLUS[k].test.why}` : "Enter both stanines to get a recommended test." }); return out; }
  const la = atts[atts.length - 1], pp = la.summary.practiceProfile;
  const w = weakSkills(rs, 2, 2);
  if (w.length) { const sk = SKILLS[w[0].skill] ? w[0].skill : SKILL_ALIASES[w[0].skill]; out.push({ t: `Weakest skill: ${w[0].skill} (${w[0].pct}%)`, d: (skillInfo(w[0].skill) || {}).activities ? skillInfo(w[0].skill).activities[0] + "." : "", chips: (typeof STRAT_FOR_SKILL !== "undefined" && STRAT_FOR_SKILL[sk]) || [] }); }
  const mt = misTally(rs)[0];
  if (mt && mt.n >= 2) out.push({ t: `Most frequent trap: ${MIS[mt.code].name} (${mt.n}×)`, d: MIS[mt.code].teach, chips: (typeof STRAT_FOR_MIS !== "undefined" && STRAT_FOR_MIS[mt.code]) || [] });
  if (typeof meaningRows === "function") { const mr = meaningRows(rs).filter(r => r.n >= 3).sort((a, b) => a.pct - b.pct)[0]; if (mr && mr.pct < 60) out.push({ t: `${mr.label} questions are hardest (${mr.pct}%)`, d: mr.label === "Literal" ? "Practise finding and rereading the exact sentence: turn the question into key words, then scan." : mr.label === "Inferential" ? "Practise linking two clues from different parts of the text." : "Practise judging statements against the whole text: would the writer agree?", chips: mr.label === "Literal" ? ["s20"] : mr.label === "Inferential" ? ["s1_6", "tlg"] : ["tlg", "s4"] }); }
  const timed = atts.filter(a => (D.asg(a.asgId) || {}).timeMode && (D.asg(a.asgId) || {}).timeMode !== "none"), untimed = atts.filter(a => (D.asg(a.asgId) || {}).timeMode === "none");
  if (timed.length && untimed.length) { const tp = avg(timed.map(a => a.summary.pct)), up = avg(untimed.map(a => a.summary.pct)); if (up - tp >= 12) out.push({ t: `Scores ${Math.round(up - tp)} points higher without a time limit`, d: "Thinking time makes a clear difference. Consider extra time, pre-reading longer texts, and checking processing speed." }); }
  const ws = typeof whyStats === "function" ? whyStats(rs) : null;
  if (ws && ws.lucky >= 3) out.push({ t: `${ws.lucky} right answers with weak reasons`, d: "Some correct answers may be guesses. Ask them to point to the clue or the sentence that proves each answer." });
  if (ws && ws.n >= 5 && ws.evidence < 40) out.push({ t: `Marks evidence on only ${ws.evidence}% of answers`, d: "Model tapping or underlining the clue before choosing.", chips: ["s5", "s20"] });
  const to = rs.filter(r => r.timedOut).length; if (to >= 3) out.push({ t: `${to} questions timed out`, d: "Check reading speed and fluency: listen to them read aloud." });
  const multi = rs.filter(r => r.multi); if (multi.length >= 3 && avg(multi.map(r => r.credit)) < 0.6) out.push({ t: `Multi-answer questions ${Math.round(avg(multi.map(r => r.credit)) * 100)}%`, d: "They often stop after one answer. Teach them to underline the number in the question and tick off each answer." });
  if (pp && k && pp !== k) out.push({ t: `Practice results look like the ${PROFILES[pp].name} profile (${PROFILES[pp].headline.toLowerCase()})`, d: `This differs from the NGRT profile (${PROFILES[k].name}). Look at both before deciding on support; consider re-testing.` });
  const days = Math.round((Date.now() - la.finishedAt) / 864e5); if (days > 21) out.push({ t: `No practice for ${days} days`, d: "Regular short practice keeps progress visible. Set a short test." });
  if (atts.length >= 2) { const f = atts[0].summary.pct, l = la.summary.pct; if (l - f >= 10) out.push({ t: `Improving: ${f}% → ${l}%`, d: "Share this progress with the student; it builds confidence." }); else if (f - l >= 10) out.push({ t: `Dropping: ${f}% → ${l}%`, d: "Check wellbeing and attitude to reading, and listen to them read." }); }
  return out;
}

/* ================= TRAINING BELOW THE TARGET =================

    rs = sess.responses.filter(r => { const it = D.item(r.itemId); return it && it.passageId === prevPassage; });
    label = "“" + ((D.passage(prevPassage) || {}).title || "this passage") + "”";
  } else if (prevStrand.key === "SC" && (sess.si !== prevSi || !nextId)) {

}
