      cats: [{ name: "The lion DOUBTS the mouse", keys: ["The lion laughed", "How could a tiny mouse"] },
        { name: "The mouse KEEPS her promise", keys: ["The little mouse heard the roaring", "She began to gnaw", "One by one, the ropes snapped"] }] } },
  verdict: { prompt: "Make two points about the lion and two about the mouse. Prove each one with the shortest quotation that works, inside your own sentence.", evidence: "Put inverted commas around every quotation.", ready: "Ready when: four points, four short quotations, each one inside my own sentence." },
  hints: ["Say your point first, then go looking for the proof.", "Read your quotation on its own. Does it prove the point without your help?", "Cut every word you don't need from the quotation."],
  bands: BANDS(["A point with no evidence.", "Evidence that is too long or doesn't prove the point.", "Short, exact evidence that proves the point.", "Short evidence inside my own sentence, with a word or two explained."],
    ["Find one sentence in the text that shows your point.", "Cut the quotation down to the words that do the work.", "Fit the quotation inside your own sentence.", "Explain which word in the quotation does the work, and why."]) },

{ id: "between", no: "04", dept: "Between the Lines", method: "Inference", skill: "Inference", mc: "#8C5A1E", text: "lighthouse",
  outcome: "I can work out what a writer has not said, from what the writer has said.",
  brief: ["Writers rarely say how a character feels. They show it and leave the reader to work it out.", "In this case you take what the text says, add what you know, and reach what it means. Every inference needs a clue."],
  steps: [{ h: "Find a clue", b: "“Her hands were shaking as she found the switch.”" },
    { h: "Add what you know", b: "People's hands shake when they are nervous, or cold." },
    { h: "Check the rest of the text", b: "She has never done this alone and her father is missing. Nervous fits better than cold." },
    { h: "Say it as a chain", b: "Mara is nervous: her hands are shaking, and she has never switched on the light by herself." }],
  exhibits: [{ level: "lo", q: "Mara is scared.", why: "<b>Thin.</b> A sensible idea, but no clue." },
    { level: "mid", q: "Mara is nervous because her hands were shaking.", why: "<b>Getting there.</b> One clue, but the reasoning isn't explained." },
    { level: "hi", q: "Mara is nervous but determined. Her “hands were shaking”, yet when two matches blow out she keeps going: “The third caught.” The writer shows she is frightened and still doesn't give up.", why: "<b>Secure.</b> Two clues, linked, describing a character who is more than one thing." }],
  falselead: [{ stem: "A reader wrote: <i>“Mara's father is angry with her, because he doesn't say anything.”</i> What went wrong?",
      opts: [{ t: "They ignored “He did not need to”, which shows his silence means pride and thanks, not anger.", ok: true, fb: "Yes. Silence can mean many things. The last line tells you which." },
        { t: "Nothing. Silence always means anger.", fb: "Silence can mean many things. The text tells you which: “He did not need to.”" },
        { t: "They should have quoted more.", fb: "More quotation won't fix a wrong reading." }] },
    { stem: "Which clue BEST shows that the storm is dangerous?",
      opts: [{ t: "“waves were throwing themselves against the lighthouse as if they meant to knock it down”", ok: true, fb: "Yes. The writer makes the waves sound violent and deliberate." },
        { t: "“The storm arrived faster than the forecast had promised”", fb: "That shows the storm was early, not how dangerous it was." },
        { t: "“Some time after midnight, the storm began to tire”", fb: "That shows the storm calming down." }] }],
  darts: {
    recon: { type: "predict", how: "Read the first two pages only. Predict how the story ends, and give the clue that made you think it. Then read the ending.", cut: 2,
      q: "What do you think happens to Mara's father?", opts: ["He comes back safely because Mara keeps the light going.", "He is lost at sea.", "He was never in danger: he stayed on the mainland."],
      model: "The writer has set up a reason for the light to matter: her father is out at sea in a storm, and only the light can guide him. A good clue: “At six, the light should have been switched on.”" },
    analysis: { type: "mark", how: "Choose a colour, then tap each sentence that shows it.",
      cats: [{ name: "Signs Mara is AFRAID", keys: ["Her hands were shaking", "For a moment Mara stood frozen"] },
        { name: "Signs Mara is BRAVE", keys: ["Then she remembered the old paraffin lamp", "She carried it up all ninety-two steps", "The third caught"] }] } },
  verdict: { prompt: "How does the writer show that Mara is both frightened and brave? Use at least two clues, and explain what each one shows.", evidence: "Underline the words in each clue that do the work.", ready: "Ready when: I have made an inference, proved it with two clues, and explained each one." },
  hints: ["Look for what Mara does with her body: hands, feet, standing still.", "Look for the moment she makes a decision.", "Ask: what would I feel if I did that? Then check the text agrees."],
  bands: BANDS(["An idea with no clue.", "One clue, with no explanation.", "An inference, a clue, and what it shows.", "Two linked clues showing a character who is more than one thing."],
    ["Find one thing the character does, and say what it shows.", "Add “This shows… because…”", "Link a second clue that adds to or complicates the first.", "Explain how the writer makes you feel what the character feels."]) },

{ id: "precis", no: "05", dept: "The Précis Desk", method: "Summarising", skill: "Summarising", mc: "#2F6B4F", text: "sleep",
  outcome: "I can make a text smaller without losing its main ideas or its shape.",
  brief: ["A summary makes the whole text smaller without losing its shape.", "You keep the main idea of each section and drop the examples and numbers that only support it."],
  steps: [{ h: "Find the sections", b: "Headings split this text: an opening, “Cleaning and sorting”, “Growing and repairing”, “The cost of too little”, and an ending." },
    { h: "Name each main idea", b: "For example, “Cleaning and sorting” means the brain clears waste and sorts memories during sleep." },
    { h: "Drop the support", b: "Numbers and examples (“nine to twelve hours”) support an idea. They don't need to be in the summary." },
    { h: "Join it up", b: "Write the main ideas as two or three sentences in your own words, in the writer's order, ending with the writer's conclusion." }],
  exhibits: [{ level: "lo", q: "The text is about sleep.", why: "<b>Thin.</b> It names the topic, not what the text says about it." },
    { level: "mid", q: "Sleep cleans the brain and helps you grow, and screens are bad.", why: "<b>Getting there.</b> Some main ideas, but it misses the writer's overall point." },
    { level: "hi", q: "Although sleep can look like wasted time, it is busy and vital: the brain clears waste and sorts memories, the body grows and repairs, and too little sleep harms concentration, mood and health. Sleep is a foundation, not a luxury.", why: "<b>Secure.</b> Every section's main idea, in order, with the writer's conclusion." }],
  falselead: [{ stem: "Which sentence is a DETAIL, not a main idea?",
      opts: [{ t: "“experts recommend nine to twelve hours a night for children aged six to twelve”", ok: true, fb: "Yes. It's an example that supports the idea that young people need more sleep." },
        { t: "“Sleep is also when the body repairs itself.”", fb: "That's the main idea of its section." },
        { t: "“It is a foundation for learning, health and happiness.”", fb: "That's the writer's conclusion." }] },
    { stem: "A reader's summary: <i>“Screens stop you sleeping.”</i> What went wrong?",
      opts: [{ t: "They summarised one detail instead of the whole text.", ok: true, fb: "Right. Screens are one point in one section." },
        { t: "It is too short.", fb: "Short is good in a summary, as long as it covers the whole text." },
        { t: "It isn't true.", fb: "It is in the text, but it isn't the whole text." }] }],
  darts: {
    recon: { type: "group", how: "These facts have been cut out of the text. Put each one back under its section heading.",
      buckets: ["Cleaning and sorting", "Growing and repairing", "The cost of too little"],
      items: [{ t: "Fluid clears away waste in deep sleep.", b: 0 }, { t: "Some memories are strengthened and others discarded.", b: 0 }, { t: "Students remember new learning better after sleep.", b: 0 }, { t: "Growth hormone is released mainly in deep sleep.", b: 1 }, { t: "Children aged six to twelve need nine to twelve hours.", b: 1 }, { t: "Concentration slips and reactions slow.", b: 2 }, { t: "Screen light can delay the signal to sleep.", b: 2 }, { t: "Lack of sleep is linked to more illness.", b: 2 }] },
    analysis: { type: "label", how: "The text is exactly as written. Label each paragraph with the job it does.",
      labels: ["Opens with a surprising idea", "Explains what the brain does", "Explains what the body does", "Warns about too little sleep", "States the conclusion"], answer: [0, 1, 2, 3, 4] } },
  verdict: { prompt: "Summarise “Why We Sleep” in no more than 50 words. Keep the writer's order and include the conclusion.", evidence: "Count your words. Cross out any example or number you don't need.", ready: "Ready when: one idea from each section, in order, plus the writer's conclusion, in 50 words or fewer." },
  hints: ["Use the headings: one idea per heading.", "If it is a number or an example, it is probably a detail.", "The last paragraph tells you the writer's big message."],
  bands: BANDS(["The topic, or one detail.", "Some main ideas, out of order or missing the conclusion.", "Every main idea, in order, with the conclusion.", "Every main idea, in order, in my own words, within the word limit."],
    ["Write one sentence for each heading.", "Put them in the writer's order and add the conclusion.", "Cut it to the word limit without losing an idea.", "Summarise a chapter of your own reading book in 40 words."]) },

{ id: "blueprint", no: "06", dept: "The Blueprint Desk", method: "How a story is built", skill: "Text structure", mc: "#A34A5E", text: "seeds",
  outcome: "I can find the beginning, problem, middle and ending of a story.",
  brief: ["Stories are built like houses: a beginning, a problem, what happens next, and an ending.", "Knowing the plan helps you follow a story and find things in it quickly."],
  steps: [{ h: "Beginning", b: "Who is in the story, and where? Sam, Gran, and a pot of soil." },
    { h: "Problem", b: "What goes wrong, or what does the character want? The seeds don't grow at first." },
    { h: "Middle", b: "What happens next? Tiny shoots appear and grow taller." },
    { h: "Ending", b: "How does it end? Tall sunflowers, and Sam learns something." }],
  exhibits: [{ level: "lo", q: "It is about flowers.", why: "<b>Thin.</b> The topic, not the plan." },
    { level: "mid", q: "Sam plants seeds and they grow.", why: "<b>Getting there.</b> A beginning and an ending, but no problem." },
    { level: "hi", q: "At the start Sam plants three seeds. The problem is that nothing happens for days. Then shoots appear and grow. At the end they are taller than Gran, and Sam learns that slow seeds can grow big.", why: "<b>Secure.</b> Every part of the plan, in order, using the story." }],
  falselead: [{ stem: "What is the PROBLEM in the story?",
      opts: [{ t: "The seeds take a long time to grow.", ok: true, fb: "Yes. “Every morning Sam looked at the pot. Nothing happened.”" },
        { t: "Sam has no pot.", fb: "Gran gives him a pot full of soil at the start." },
        { t: "The sunflowers are too tall.", fb: "That's the happy ending, not a problem." }] },
    { stem: "Which sentence is the ENDING?",
      opts: [{ t: "“Slow seeds can grow big,” he said.", ok: true, fb: "Yes. Sam learns something at the end." },
        { t: "Gran gave him a pot full of soil.", fb: "That's the beginning." },
        { t: "On the fifth day, Sam saw a tiny green shoot.", fb: "That's the middle." }] }],
  darts: {
    recon: { type: "sequence", how: "The story has been cut up. Tap the events in the right order.",
      items: ["Gran gives Sam a pot of soil.", "Sam pushes three seeds into the soil.", "Sam looks at the pot every morning, but nothing happens.", "Sam sees a tiny green shoot.", "The shoots grow taller and taller.", "Three tall sunflowers stand by the back door."] },
    analysis: { type: "label", how: "The story is exactly as written. Label each paragraph: is it the beginning, the problem, the middle or the ending?",
      labels: ["Beginning", "Problem", "Middle", "Ending"], answer: [0, 0, 1, 2, 2, 3] } },
  verdict: { prompt: "Draw a story plan in your book with four boxes: Beginning, Problem, Middle, Ending. Write one sentence in each box, using words from the story.", evidence: "Underline one word from the story in each box.", ready: "Ready when: four boxes, in order, each with a sentence about the story." },
  hints: ["The beginning tells you who and where.", "The problem is the moment you start to worry.", "The ending is where the problem is solved."],
  bands: BANDS(["Only the topic.", "Some parts, but out of order.", "All four parts, in order.", "All four parts, with words from the story and what the character learns."],
    ["Find who and where.", "Find the problem.", "Use a word from the story in each box.", "Plan a story of your own with the same four parts."]) },

{ id: "langlab", no: "07", dept: "The Language Lab", method: "Word choice and effect", skill: "Language techniques", mc: "#4A5F2C", text: "railway",
  outcome: "I can find a technique, name it, and explain what it does to the reader.",
  brief: ["Poets choose words for their sound as well as their meaning.", "In the Language Lab you find a technique, name it, and say what it does to the reader. Naming it is only a third of the job."],
  steps: [{ h: "Find it", b: "“Faster than fairies, faster than witches”" },
    { h: "Name it", b: "Repeated <i>f</i> sounds (alliteration) and a repeated pattern (“faster than”)." },
    { h: "Say what it does", b: "The quick, repeated beat sounds like a train's wheels on the track." },
    { h: "Link it to the whole poem", b: "The whole poem rushes, like the view from a speeding train." }],
  exhibits: [{ level: "lo", q: "The poem uses alliteration.", why: "<b>Thin.</b> A technique named, but not where or why." },
    { level: "mid", q: "“Faster than fairies” is alliteration because of the f sounds.", why: "<b>Getting there.</b> Found and named, but no effect." },
    { level: "hi", q: "“Faster than fairies, faster than witches” repeats f sounds and the pattern “faster than”, which makes a quick, galloping beat like train wheels, so the reader feels the speed.", why: "<b>Secure.</b> Found, named, and the effect explained." }],
  falselead: [{ stem: "<i>“charging along like troops in a battle”</i> A reader called this a metaphor. What went wrong?",
      opts: [{ t: "It uses “like”, so it is a simile.", ok: true, fb: "Yes. A simile compares using like or as." },
        { t: "It is really onomatopoeia.", fb: "Onomatopoeia imitates a sound. This compares two things." },
        { t: "Nothing.", fb: "Check: is there a “like” or an “as”?" }] },
    { stem: "Which line makes the reader feel things vanish very quickly?",
      opts: [{ t: "“Each a glimpse and gone for ever!”", ok: true, fb: "Yes. A glimpse is a very quick look, and “gone for ever” shows it can't come back." },
        { t: "“Here is a tramp who stands and gazes”", fb: "This describes one sight, and it's slow." },
        { t: "“Bridges and houses, hedges and ditches”", fb: "This lists sights but doesn't say they vanish." }] }],
  darts: {
    recon: { type: "group", how: "These phrases have been taken out of the poem. Sort each one by what the poet is doing.",
      buckets: ["A comparison (like / as)", "Repeated sounds", "A sight from the window"],
      items: [{ t: "charging along like troops in a battle", b: 0 }, { t: "Fly as thick as driving rain", b: 0 }, { t: "Faster than fairies, faster than witches", b: 1 }, { t: "clambers and scrambles", b: 1 }, { t: "a mill and there is a river", b: 2 }, { t: "a tramp who stands and gazes", b: 2 }, { t: "a cart run away in the road", b: 2 }] },
    analysis: { type: "mark", how: "The poem is exactly as written. Tap every line that makes the train feel FAST.",
      cats: [{ name: "Makes the train feel FAST", keys: ["Faster than fairies", "Fly as thick as driving rain", "in the wink of an eye", "Painted stations whistle by", "Each a glimpse and gone for ever"], also: ["charging along like troops", "All of the sights of the hill"] }] } },
  verdict: { prompt: "Choose two lines from the poem. For each one, quote it, name the technique, and explain what it makes the reader see, hear or feel.", evidence: "Underline the exact words that create the effect.", ready: "Ready when: two quotations, each named and with its effect explained." },
  hints: ["Read the line aloud. What do you hear?", "Look for like or as: that's a comparison.", "Ask: why this word, and not a plainer one?"],
  bands: BANDS(["A technique named, with no example.", "Found and named, but no effect.", "Found, named, and the effect explained.", "Effect explained and linked to the whole poem."],
    ["Find one line and say what you notice.", "Say what it makes you see, hear or feel.", "Link it to what the whole poem is about.", "Try the same technique in a poem of your own."]) },

{ id: "chain", no: "08", dept: "The Chain Room", method: "Explaining cause and effect", skill: "Inference", mc: "#2D5C88", text: "fox",
  outcome: "I can explain a fact with a chain: what it is, what it does, and why it matters.",
  brief: ["“Because” is the most powerful word in reading. In the Chain Room you link a fact to what it does, and what it does to why it matters.", "A good chain has no missing links."],
  steps: [{ h: "Start with a fact", b: "The fennec fox has enormous ears." },
    { h: "What does it do?", b: "Its ears let heat escape from its body." },
    { h: "Why does it matter?", b: "The Sahara's days are scorching, so losing heat keeps it cool." },
    { h: "Say the whole chain", b: "Its enormous ears let heat escape, which keeps it cool in the scorching desert." }],
  exhibits: [{ level: "lo", q: "The fox has big ears.", why: "<b>Thin.</b> A fact, with no chain." },
    { level: "mid", q: "The fox has big ears to let heat out.", why: "<b>Getting there.</b> Two links, but not why it matters." },
    { level: "hi", q: "The fennec fox's enormous ears let heat escape from its body, which matters because the Sahara's days are “scorching”. So its ears help it survive the heat.", why: "<b>Secure.</b> Fact, what it does, why it matters, with a quotation." }],
  falselead: [{ stem: "A reader wrote: <i>“The fox sleeps in the day because it is lazy.”</i> What went wrong?",
      opts: [{ t: "They invented a reason. The text says it sleeps in a cool burrow, away from the heat.", ok: true, fb: "Yes. The reason must come from the text." },
        { t: "Nothing. Foxes are lazy.", fb: "The text never says that." },
        { t: "The fox actually sleeps at night.", fb: "The text says it is nocturnal: it sleeps in the day." }] },
    { stem: "Which is the best chain for the fur on its feet?",
      opts: [{ t: "Thick fur on its soles protects its feet from the burning ground, so it can walk on hot sand.", ok: true, fb: "Yes: fact, what it does, why it matters." },
        { t: "It has fur on its feet because it is a fox.", fb: "That isn't a reason from the text." },
        { t: "The fur keeps it warm at night.", fb: "The text links the fur to the burning ground, not the cold." }] }],
  darts: {
    recon: { type: "chain", how: "Complete the chain diagram. Choose the missing link in each empty box.",
      cols: ["Feature", "What it does", "Why it helps"],
      rows: [["Enormous ears", { b: "let heat escape" }, { b: "keeps it cool in the scorching desert" }], ["Very sensitive hearing", { b: "hears insects under the sand" }, { b: "it can find food in the dark" }], ["Thick fur on its soles", { b: "protects its feet" }, { b: "it can walk on burning ground" }], ["Sleeps in a burrow by day", { b: "stays out of the sun" }, { b: "avoids the hottest part of the day" }]],
      distractors: ["keeps it warm in the snow", "helps it swim"] },
    analysis: { type: "tablebuild", how: "Build your own chain table. For each feature, quote the text, then explain why it helps the fox.",
      cols: ["Feature", "Quote from the text", "Why it helps the fox"], fixed: ["Ears", "Feet", "Water"],
      model: [["Ears", "“let heat escape from its body”", "It stays cool in the scorching heat."], ["Feet", "“Thick fur on the soles of its feet”", "It can walk on burning sand."], ["Water", "“it gets most of its water from the food it eats”", "It doesn't need to find water in the desert."]] } },
  verdict: { prompt: "Explain how the fennec fox survives in the desert. Write three chains, each with a fact, what it does, and why it helps. Quote the text at least twice.", evidence: "Circle the joining words in your chains: because, which, so.", ready: "Ready when: three complete chains, with at least two quotations." },
  hints: ["Start with a body part or a habit.", "Ask “what does that do?” and then “so what?”", "Join the links with because, which or so."],
  bands: BANDS(["A fact on its own.", "A fact and what it does.", "Fact, what it does, and why it matters.", "Three full chains, with quotations and joining words."],
    ["Add “which means…”", "Add “so…” to say why it matters.", "Quote the text in each chain.", "Write a chain about an animal you research yourself."]) },

{ id: "questions", no: "09", dept: "The Question Room", method: "Asking questions", skill: "Questioning", mc: "#5B4D9A", text: "wind",
  outcome: "I can ask my own questions about a text, at three levels, and answer them.",
  brief: ["Good readers ask questions while they read. Some answers are right there, some need searching, and some need you and the text together.", "Writing your own questions is the best check that you've understood."],
  steps: [{ h: "Right there", b: "The answer is in one place: “What do the leaves do when the wind passes through?”" },
    { h: "Think and search", b: "Put two parts together: “How do we know the wind is there if we can't see it?”" },
    { h: "Author and me", b: "Use the poem and your own thinking: “Why might the poet write about something invisible?”" },
    { h: "Check your questions", b: "Can someone answer each one using the poem, or the poem and their own thinking?" }],
  exhibits: [{ level: "lo", q: "What is the poem?", why: "<b>Thin.</b> Not about the poem's ideas." },
    { level: "mid", q: "What do the trees do?", why: "<b>Getting there.</b> A right-there question. Try a deeper one." },
    { level: "hi", q: "If nobody can see the wind, how does the poet prove it is there? (Think and search: the leaves tremble and the trees bow.)", why: "<b>Secure.</b> A deeper question, with how to answer it." }],
  falselead: [{ stem: "Which is a THINK AND SEARCH question?",
      opts: [{ t: "How do the two verses show the same idea in different ways?", ok: true, fb: "Yes. You need both verses to answer it." },
        { t: "What is the first line?", fb: "That's right there." },
        { t: "What is your favourite season?", fb: "That isn't about the poem." }] },
    { stem: "A reader asked: <i>“What colour is the wind?”</i> What's wrong with this question?",
      opts: [{ t: "The poem can't answer it, and it doesn't help you understand the poem.", ok: true, fb: "Right. A good question leads back into the text." },
        { t: "Nothing.", fb: "Can anyone answer it from the poem?" },
        { t: "It is too short.", fb: "Short questions can be excellent. This one just can't be answered from the poem." }] }],
  darts: {
    recon: { type: "group", how: "Sort these questions about the poem into the three kinds.",
      buckets: ["Right there", "Think and search", "Author and me"],
      items: [{ t: "What do the leaves do when the wind passes through?", b: 0 }, { t: "Who has seen the wind, according to the poem?", b: 0 }, { t: "How are the two verses alike and different?", b: 1 }, { t: "What two signs show the wind is there?", b: 1 }, { t: "Why might the poet write about something we can't see?", b: 2 }, { t: "What else is real even though we can't see it?", b: 2 }] },
    analysis: { type: "questions", how: "Write your own question of each kind about the poem, and answer it. Then compare with the examples.",
      kinds: [{ name: "Right there", hint: "The answer is in one place in the poem.", model: "Q: What do the trees do when the wind passes by? A: They “bow down their heads”." },
        { name: "Think and search", hint: "The answer needs two parts of the poem.", model: "Q: How does each verse prove the wind is there? A: The first uses trembling leaves; the second uses bowing trees." },
        { name: "Author and me", hint: "Use the poem and your own thinking.", model: "Q: Why does the poet ask a question nobody can answer with “I have”? A: To make us think about things we know are real but can't see." }] } },
  verdict: { prompt: "Write three questions about the poem, one of each kind, and answer each one. For the right-there and think-and-search answers, quote the poem.", evidence: "Label each question with its kind.", ready: "Ready when: three labelled questions, each answered, with two quotations." },
  hints: ["Start right-there questions with who, what or where.", "Think-and-search questions often start with how or why, and need two places in the text.", "Author-and-me questions ask what the poem makes you think about."],
  bands: BANDS(["Questions not about the text.", "Only right-there questions.", "One of each kind, answered.", "One of each kind, answered with quotations, and a question that made me think again."],
    ["Ask a who, what or where question about the poem.", "Ask a how or why question that needs two parts.", "Answer your questions with quotations.", "Ask your questions to a partner and see what they say."]) }
];

/* Drills on the training floor (same texts as the cases) */
const LAB_DRILLS = [
  { id: "factinf", name: "Fact or Inference", secs: 60, target: 9, blurb: "Was it stated, worked out, or never in the text at all?", buckets: ["Stated", "Worked out", "Not there"],
    items: [{ t: "Sam pushed three seeds into the soil.", a: 0, why: "Sam's Seeds says it directly." }, { t: "Sam was impatient to see his seeds grow.", a: 1, why: "Worked out: he looked at the pot every morning." }, { t: "Gran bought the sunflower seeds.", a: 2, why: "The story never says where the seeds came from." },
      { t: "Bees eat about eight grams of honey to make one gram of wax.", a: 0, why: "Stated in “The perfect shape”." }, { t: "Bees are careful builders.", a: 1, why: "Worked out: each cell is checked and smoothed." }, { t: "Bees sleep inside the honeycomb cells.", a: 2, why: "The text never mentions where bees sleep." },
      { t: "Uncle Karim sold handmade lanterns.", a: 0, why: "Stated in The Night Market." }, { t: "Layla was sorry for what she said to the boy.", a: 1, why: "Worked out: she ran after him with a lantern." }, { t: "The boy's mother bought the ship lantern.", a: 2, why: "Nobody buys the ship lantern." },
      { t: "Mara's father had rowed to the mainland for supplies.", a: 0, why: "Stated on page 1." }, { t: "Mara's father was proud of her.", a: 1, why: "Worked out: “He did not need to.”" }, { t: "Mara's father was angry that she used the old lamp.", a: 2, why: "Nothing suggests anger." },

  }

      <input type="text" placeholder="Your question" value="${esc(v[k + "_q"] || "")}" oninput="LAB.setText('${kind}','v',this.value,'${k}_q')"><input type="text" placeholder="Your answer" value="${esc(v[k + "_a"] || "")}" oninput="LAB.setText('${kind}','v',this.value,'${k}_a')">

function markResult(c, d, m) {
  const units = labUnits(c.text).flatMap(p => p.units), byUnit = {}; let need = 0, found = 0, extra = 0;

    const cat = d.cats.findIndex(ct => ct.keys.some(k => u.t.includes(k)));
    const also = d.cats.findIndex(ct => (ct.also || []).some(k => u.t.includes(k)));
    if (cat >= 0) { need++; if (m[u.i] === cat) { found++; byUnit[u.i] = "right"; } else if (m[u.i] != null) byUnit[u.i] = "wrong"; else byUnit[u.i] = "missed"; }
    else if (m[u.i] != null) { if (also >= 0 && m[u.i] === also) byUnit[u.i] = "right"; else { extra++; byUnit[u.i] = "wrong"; } }
  });
  return { need, found, extra, byUnit };
}
function dartScore(c, kind, ds) {
  const d = c.darts[kind], S_ = ds.state || {};

  if (d.type === "sequence") { const o = S_.order || []; return [o.filter((k, pos) => k === pos).length, d.items.length]; }
  if (d.type === "group") { const g = S_.g || {}; return [d.items.filter((it, k) => g[k] === it.b).length, d.items.length]; }
  if (d.type === "tablefill" || d.type === "chain") { const bl = []; d.rows.forEach(r => r.forEach(cell => { if (cell && cell.b) bl.push(cell.b); })); return [bl.filter((b, k) => (S_.v || {})[k] === b).length, bl.length]; }
  if (d.type === "label") { return [d.answer.filter((a, k) => String((S_.v || {})[k]) === String(a)).length, d.answer.length]; }
  if (d.type === "mark") { const r = markResult(c, d, S_.m || {}); return [Math.max(0, r.found - r.extra), r.need]; }
  return [0, 0];
}

/* ---------- actions ---------- */
const LAB = {
  doc() { return labDoc(S.studentId); },
  tab(k) { LS().tab = k; LS().case = null; LS().drill = null; render(); },
  open(id) { const L_ = LS(), doc = LAB.doc(), st = caseSt(doc, id); L_.case = id; L_.dart = null; st.closedNow = false; const i = st.stages.findIndex(x => !x); L_.stage = i < 0 ? 5 : i; labSave(doc); render(); window.scrollTo(0, 0); },
  close(tab) { const L_ = LS(); L_.case = null; if (tab) L_.tab = tab; render(); window.scrollTo(0, 0); },
  stage(i) { LS().stage = i; render(); },
  done(i) { const doc = LAB.doc(), st = caseSt(doc, LS().case); st.stages[i] = true; labSave(doc); LS().stage = i + 1; render(); window.scrollTo(0, 0); },
  hint() { const doc = LAB.doc(), st = caseSt(doc, LS().case); if (st.hints < 3) st.hints++; labSave(doc); render(); },
  fl(qi, oi) { const doc = LAB.doc(), c = labCase(LS().case), st = caseSt(doc, c.id); st.flPick = st.flPick || {}; st.flPick[qi] = (st.flPick[qi] || []).concat(oi); if (c.falselead[qi].opts[oi].ok) st.fl[qi] = true; labSave(doc); render(); },
  dart(k) { LS().dart = k; render(); },
  ds(kind) { const doc = LAB.doc(), st = caseSt(doc, LS().case); st[kind].state = st[kind].state || {}; return { doc, st, ds: st[kind], S_: st[kind].state }; },
  set(kind, key, k, val) { const { doc, ds, S_ } = LAB.ds(kind); if (k == null) S_[key] = val; else { S_[key] = S_[key] || {}; S_[key][k] = val; } ds.checked = false; labSave(doc); render(); },
  setText(kind, key, val, k) { const { doc, S_ } = LAB.ds(kind); if (k == null) S_[key] = val; else { S_[key] = S_[key] || {}; S_[key][k] = val; } labSave(doc); },
  seq(k) { const { doc, ds, S_ } = LAB.ds(LS().dart || "recon"); S_.order = (S_.order || []).concat(k); ds.checked = false; labSave(doc); render(); },
  unseq(k) { const { doc, ds, S_ } = LAB.ds(LS().dart || "recon"); S_.order = (S_.order || []).filter(x => x !== k); ds.checked = false; labSave(doc); render(); },
  mark(i) { const kind = LS().dart || "analysis"; const { doc, ds, S_ } = LAB.ds(kind); S_.m = S_.m || {}; const cur = S_.cur || 0; if (S_.m[i] === cur) delete S_.m[i]; else S_.m[i] = cur; ds.checked = false; labSave(doc); render(); },
  check(kind) { const { doc, ds } = LAB.ds(kind), c = labCase(LS().case); const [sc, mx] = dartScore(c, kind, ds); ds.score = sc; ds.max = mx; ds.checked = true; ds.checks = (ds.checks || 0) + 1; ds.done = true; ds.at = Date.now(); labSave(doc); render(); },
  reveal(kind) { const { doc, ds, S_ } = LAB.ds(kind), c = labCase(LS().case), d = c.darts[kind];
    if (d.type === "cloze") { S_.v = {}; [...d.text.matchAll(/\[\[([^\]]+)\]\]/g)].forEach((x, k) => S_.v[k] = x[1]); }
    if (d.type === "sequence") S_.order = d.items.map((_, k) => k);
    if (d.type === "group") { S_.g = {}; d.items.forEach((it, k) => S_.g[k] = it.b); }
    if (d.type === "tablefill" || d.type === "chain") { S_.v = {}; let n = 0; d.rows.forEach(r => r.forEach(cell => { if (cell && cell.b) S_.v[n++] = cell.b; })); }
    if (d.type === "label") { S_.v = {}; d.answer.forEach((a, k) => S_.v[k] = a); }
    ds.revealed = true; ds.checked = true; labSave(doc); render(); },
  compare(kind) { const { doc, ds, S_ } = LAB.ds(kind), c = labCase(LS().case), d = c.darts[kind]; const v = S_.v || {};
    const filled = Object.values(v).filter(x => String(x).trim().split(/\s+/).length >= 2).length, need = d.type === "tablebuild" ? d.fixed.length * (d.cols.length - 1) : d.kinds.length * 2;
    if (filled < Math.ceil(need * 0.6)) { toast("Fill in most of the boxes first, then compare."); return; }
    S_.compared = true; ds.done = true; ds.at = Date.now(); labSave(doc); render(); },
  revealEnding() { const { doc, ds, S_ } = LAB.ds("recon"); if (S_.pick == null || String(S_.clue || "").trim().split(/\s+/).length < 3) { toast("Choose a prediction and write your clue first."); return; } S_.revealed = true; ds.done = true; ds.at = Date.now(); labSave(doc); render(); },
  vtext(v) { const doc = LAB.doc(), st = caseSt(doc, LS().case); st.verdict.text = v; labSave(doc); },
  vbook(on) { const doc = LAB.doc(), st = caseSt(doc, LS().case); st.verdict.inBook = on; labSave(doc); render(); },
  band(b) { const doc = LAB.doc(), st = caseSt(doc, LS().case); st.verdict.band = b; labSave(doc); render(); },
  closeCase() { const doc = LAB.doc(), st = caseSt(doc, LS().case), v = st.verdict; const today = fmtDate(Date.now());
    st.goes.push({ date: today, band: v.band, text: v.text, inBook: v.inBook }); st.stages[5] = true; if (!st.solvedAt) st.solvedAt = today; st.closedNow = true; labSave(doc); render(); },

/* ================= CONFIG =================
   To share one platform across many devices (teacher laptop + student iPads), paste your Firebase
   web config here, or in Settings > Storage on each device. Leave null to keep data on this device only. */
const FIREBASE_CONFIG = null; // e.g. { apiKey:"…", authDomain:"…", projectId:"…", appId:"…" }
/* Copies hosted elsewhere (e.g. GitHub Pages) read the shared database settings from the Firebase site. */
const FIREBASE_CONFIG_URL = "https://ngrt-reading-lab.web.app/config.json";
const FB_PREFIX = "ngrt_";
const IN_ARTIFACT = typeof window !== "undefined" && !!window.claude;

const COLS = ["meta", "classes", "students", "passages", "items", "assignments", "attempts", "lab", "labasg"];

/* ================= STORE ================= */
const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
const ssGet = (k, d = null) => { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const ssSet = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const Store = {
  mode: "local", cache: {}, fdb: null, saveT: null, error: null,
  key: "ngrt_platform_v1",
  async init() {
    COLS.forEach(c => this.cache[c] = {});
    let cfg = FIREBASE_CONFIG || lsGet("ngrt_fb_cfg");
    if (!cfg && FIREBASE_CONFIG_URL && !IN_ARTIFACT && /^https?:$/.test(location.protocol)) {
      try {
        const ac = new AbortController(), t = setTimeout(() => ac.abort(), 5000);
        const r = await fetch(FIREBASE_CONFIG_URL, { cache: "no-store", signal: ac.signal }); clearTimeout(t);
        if (r.ok) { const j = await r.json(); if (j && j.projectId) cfg = j; }
      } catch (e) { console.warn("No shared database settings found", e); }
    }
    if (cfg) {
      try { await this.initFirebase(cfg); this.mode = "firebase"; return; }
      catch (e) { this.error = "Could not connect to Firebase (" + (e.message || e) + "). Using this device's storage."; console.warn(e); }
    }
    this.loadLocal();
    window.addEventListener("storage", e => { if (e.key === this.key) { this.loadLocal(); scheduleRender(); } });
  },
  loadLocal() { const d = lsGet(this.key, {}); COLS.forEach(c => this.cache[c] = (d && d[c]) || {}); },
  saveLocal() { clearTimeout(this.saveT); this.saveT = setTimeout(() => { if (!lsSet(this.key, this.cache)) toast("This browser is not saving data. Export a backup from Settings."); }, 120); },
  async initFirebase(cfg) {
    const v = "10.12.2";
    const tryLoad = async (f) => { try { await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/${f}`); } catch (e) { await loadScript(`https://www.gstatic.com/firebasejs/${v}/${f}`); } };
    await tryLoad("firebase-app-compat.js"); await tryLoad("firebase-firestore-compat.js");
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    this.fdb = firebase.firestore(app);
    await Promise.race([
      Promise.all(COLS.map(c => new Promise((res, rej) => {
        let first = true;
        this.fdb.collection(FB_PREFIX + c).onSnapshot(snap => {
          const m = {}; snap.forEach(d => m[d.id] = d.data()); this.cache[c] = m;
          if (first) { first = false; res(); } else scheduleRender();
        }, err => { if (first) rej(err); else console.warn(err); });
      }))),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timed out")), 12000))
    ]);
  },
  all(c) { return Object.values(this.cache[c] || {}); },
  get(c, id) { return (this.cache[c] || {})[id] || null; },
  put(c, o) {
    o = JSON.parse(JSON.stringify(o)); o.updatedAt = Date.now();
    this.cache[c][o.id] = o;
    if (this.mode === "firebase") this.fdb.collection(FB_PREFIX + c).doc(o.id).set(o).catch(e => toast("Save failed: " + e.message));
    else this.saveLocal();
    return o;
  },
  putMany(c, arr) {
    if (this.mode === "firebase") {
      for (let i = 0; i < arr.length; i += 400) {
        const b = this.fdb.batch();
        arr.slice(i, i + 400).forEach(o => { o = JSON.parse(JSON.stringify(o)); o.updatedAt = Date.now(); this.cache[c][o.id] = o; b.set(this.fdb.collection(FB_PREFIX + c).doc(o.id), o); });
        b.commit().catch(e => toast("Save failed: " + e.message));
      }
    } else { arr.forEach(o => { o = JSON.parse(JSON.stringify(o)); o.updatedAt = Date.now(); this.cache[c][o.id] = o; }); this.saveLocal(); }
  },
  del(c, id) {
    delete this.cache[c][id];
    if (this.mode === "firebase") this.fdb.collection(FB_PREFIX + c).doc(id).delete();
    else this.saveLocal();
  },
  exportAll() { return JSON.stringify({ format: "ngrt-reading-lab", version: 1, exportedAt: new Date().toISOString(), data: this.cache }, null, 1); },
  importAll(json) {
    const d = JSON.parse(json); const data = d.data || d;
    COLS.forEach(c => { if (data[c]) this.putMany(c, Object.values(data[c])); });
  },
  wipe() { COLS.forEach(c => Object.keys(this.cache[c]).forEach(id => this.del(c, id))); }
};
function loadScript(src) {

}

  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ngrt::" + s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); }

function quadrantSVG(students) {

      <p>In the National Literacy Trust's 2025 survey of nearly 115,000 children and young people, the share of 8 to 18-year-olds who enjoy reading in their free time fell to its lowest point in 20 years ${cite("nlt")}. OECD PISA data show that, in every participating country, students who enjoy reading most outperform those who enjoy it least ${cite("pisa")}.</p>

      </div>

    </div>

  <section class="lp-sec">
    <div class="lp-num">5</div>
    <div class="lp-body">
      <h2>How this platform applies the evidence</h2>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>The research points to</th><th>What NGRT Reading Lab does</th></tr></thead><tbody>
        <tr><td>Diagnose the barrier: word level or comprehension ${cite("eef")}</td><td>Places every student on GL's ten SC/PC profiles and reports Sentence Completion and Passage Comprehension skills separately.</td></tr>
        <tr><td>Texts at the right level of challenge ${cite("eef")}</td><td>Starts each strand from the student's stanine and moves up or down a level after streaks of answers and on the quality of recent answers.</td></tr>
        <tr><td>Practise strategies on connected text ${cite("eef")}</td><td>Passage questions cover retrieval, inference, vocabulary in context, structure and language, including multi-answer items that reward complete reasoning.</td></tr>
        <tr><td>Pupils with low reading attainment may need phonics, guided by careful diagnosis ${cite("eef")}; older pupils with a reading age of 8 or below are likely to need a phonics programme, started at the point they need ${cite("dfe")}</td><td>Like NGRT Digital, sends students with SC stanine 1, or still struggling at Level 1, to a word-reading (phonics) route with five phases. Teachers can also route students with a reading age of 8:00 or below.</td></tr>
        <tr><td>Texts at the right level of challenge ${cite("eef")}</td><td>Checks every question's level against how students with known NGRT scores actually answer it, and suggests a new level when the evidence is clear.</td></tr>
        <tr><td>Monitor progress over time</td><td>Tracks the level reached in each test and the skills behind it, for each student and the whole class.</td></tr>
        <tr><td>Motivation and reading for pleasure ${cite("nlt")}</td><td>Gives every finished test a certificate and each student a reading tip matched to their profile.</td></tr>
      </tbody></table></div>
      <p class="caveat"><b>Its limits:</b> this is practice, not a standardised test. Calibration from one class is rough and improves as more students answer. Levels are indicative and do not replace NGRT scores, and GL's profiles are illustrative descriptions to be weighed with teacher knowledge ${cite("glp")}.</p>

/* ---------- Overview ---------- */
function classStats(cid) {
  const studs = D.students(cid);
  const latest = studs.map(s => ({ s, a: D.latest(s.id) }));
  const atts = D.attempts(a => a.classId === cid && a.status === "complete");
  const skills = { SC: {}, PC: {}, WR: {} };
  atts.forEach(a => a.sess.responses.forEach(r => { const g = skills[r.strand]; (g[r.skill] = g[r.skill] || []).push(r.credit); }));
  const skillRows = k => Object.entries(skills[k]).map(([label, arr]) => ({ label, n: arr.length, pct: Math.round(avg(arr) * 100) })).sort((a, b) => a.pct - b.pct);
  const phonics = studs.filter(s => s.sc === 1 || D.completeFor(s.id).some(a => a.sess.route));
  const lowRA = studs.filter(s => s.ra != null && s.ra <= 96 && !phonics.includes(s));
  return { studs, latest, atts, phonics, lowRA, scSkills: skillRows("SC"), pcSkills: skillRows("PC"), wrSkills: skillRows("WR") };
}

function tabBank() {
  const sets = D.sets(), items = Store.all("items"), passages = Store.all("passages");
  const f = S.bankF;
  let list = items.filter(i => (!f.set || i.set === f.set) && (!f.strand || i.strand === f.strand) && (!f.level || i.level === +f.level) && (!f.q || (i.stem + " " + i.options.join(" ")).toLowerCase().includes(f.q.toLowerCase())));
  list.sort((a, b) => a.strand.localeCompare(b.strand) || a.level - b.level || (a.passageId || "").localeCompare(b.passageId || "") || (a.order || 0) - (b.order || 0));
  const shown = list.slice(0, 150);
  const matrix = ["SC", "PC", "WR"].map(k => [1, 2, 3, 4, 5].map(l => k !== "PC" ? items.filter(i => i.strand === k && i.level === l).length : passages.filter(p => p.level === l && items.some(i => i.passageId === p.id)).length));
  const noKey = items.filter(i => !i.answers || !i.answers.length).length;
  return `<div class="stack" style="gap:20px">
    <div class="row between"><div><span class="eyebrow">Shared by all classes</span><h2 style="margin-top:4px">Question bank</h2></div><div class="row"><button class="btn primary" onclick="T.importOpen()">Upload questions</button><button class="btn" onclick="T.keyOpen()">Upload answer key</button></div></div>
    <div class="grid g2">
      <section class="panel"><div class="panel-h"><h3>Coverage by level</h3><span class="muted small">adaptive tests need items at every level</span></div>
        <div class="tbl-wrap"><table class="t lvl-matrix"><thead><tr><th></th>${[1, 2, 3, 4, 5].map(l => `<th style="text-align:center">L${l}<br><span style="font-weight:400;letter-spacing:0;text-transform:none">${LEVELS[l].band}</span></th>`).join("")}</tr></thead><tbody>
        <tr><td><b>SC questions</b></td>${matrix[0].map(n => `<td class="c ${n < 3 ? "zero" : ""}">${n}</td>`).join("")}</tr>
        <tr><td><b>PC passages</b></td>${matrix[1].map(n => `<td class="c ${n < 1 ? "zero" : ""}">${n}</td>`).join("")}</tr>
        <tr><td><b>Phonics words</b><br><span class="muted small">L1–5 = phases 1–5</span></td>${matrix[2].map(n => `<td class="c ${n < 3 ? "zero" : ""}">${n}</td>`).join("")}</tr></tbody></table></div>
        <p class="small muted" style="margin-top:10px">Red cells are thin. When a level runs out, the test uses the nearest level that still has questions.</p></section>
      <section class="panel"><div class="panel-h"><h3>Sets</h3>${noKey ? `<span class="chip crit">${noKey} without an answer key</span>` : ""}</div>
        <div class="stack" style="gap:8px">${sets.map(st => `<div class="row between"><span><b>${esc(st.name)}</b> <span class="muted small">${[st.sc && st.sc + " SC", st.pc && st.pc + " PC", st.wr && st.wr + " phonics"].filter(Boolean).join(" · ")}</span></span><span class="row" style="gap:6px"><button class="btn ghost sm" onclick="T.setFilter('set','${esc(st.name)}')">View</button><button class="btn ghost sm danger" onclick="T.delSet('${esc(st.name)}')">Delete set</button></span></div>`).join("") || `<div class="empty small">No questions yet.</div>`}</div></section>
    </div>
    ${calPanel()}
    <section class="stack" style="gap:12px">
      <div class="row">
        <select id="bf-set" aria-label="Set" onchange="T.setFilter('set',this.value)" style="width:auto"><option value="">All sets</option>${sets.map(st => `<option ${f.set === st.name ? "selected" : ""}>${esc(st.name)}</option>`).join("")}</select>
        <select id="bf-strand" aria-label="Part" onchange="T.setFilter('strand',this.value)" style="width:auto"><option value="">All parts</option><option value="SC" ${f.strand === "SC" ? "selected" : ""}>Sentence Completion</option><option value="PC" ${f.strand === "PC" ? "selected" : ""}>Passage Comprehension</option><option value="WR" ${f.strand === "WR" ? "selected" : ""}>Word reading (phonics)</option></select>
        <select id="bf-level" aria-label="Level" onchange="T.setFilter('level',this.value)" style="width:auto"><option value="">All levels</option>${[1, 2, 3, 4, 5].map(l => `<option value="${l}" ${+f.level === l ? "selected" : ""}>Level ${l}</option>`).join("")}</select>
        <input type="text" id="bf-q" placeholder="Search questions" value="${esc(f.q)}" onkeydown="if(event.key==='Enter')T.setFilter('q',this.value)" style="width:auto;flex:1;min-width:160px">
        <button class="btn sm" onclick="T.newItem()">Write a question</button>
      </div>
      <p class="small muted">${list.length} question${list.length === 1 ? "" : "s"}${list.length > shown.length ? `, showing the first ${shown.length}` : ""}.</p>
      ${shown.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Part</th><th>Level</th><th>Data says</th><th>Skill</th><th>Question</th><th>Answer key</th><th>Set</th><th></th></tr></thead><tbody>
      ${shown.map(i => { const p = i.passageId && D.passage(i.passageId); const c = calData().items[i.id], pc = p && calData().passages[p.id], ref = pc || c; return `<tr><td>${i.strand}</td><td class="num">L${i.level}${i.authorLevel && i.authorLevel !== i.level ? ` <span class="muted small" title="Originally Level ${i.authorLevel}">(was ${i.authorLevel})</span>` : ""}</td>
        <td class="small nowrap">${ref ? `${ref.dataLevel ? `<span class="chip ${ref.suggest ? "warn" : "good"} num">L${ref.dataLevel}</span>` : `<span class="muted">${ref.n} answers</span>`}${c && c.flags.length ? ` <span class="chip crit" title="${esc(c.flags.join(" "))}">check</span>` : ""}` : `<span class="muted">–</span>`}</td>
        <td class="small">${esc(i.skill)}</td><td class="small" style="min-width:240px">${p ? `<span class="muted">${esc(p.title)}${p.link ? " (linked)" : ""} ·</span> ` : ""}${esc(i.stem)}${i.say ? ` <span class="chip info">says “${esc(i.say)}”</span>` : ""}${i.answers.length > 1 ? ` <span class="chip hl">multi · ${i.answers.length}</span>` : ""}</td>
        <td class="small">${i.answers.length ? esc(i.answers.map(a => L(a) + ") " + i.options[a]).join(", ")) : `<span class="chip crit">missing</span>`}</td><td class="small muted">${esc(i.set)}</td>
        <td class="nowrap"><button class="btn ghost sm" onclick="T.editItem('${i.id}')">Edit</button>${p ? `<button class="btn ghost sm" onclick="T.editPassage('${p.id}')">Passage</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">No questions match.</div>`}
    </section>
  </div>`;
}

function importModalHTML() {

      <div class="tbl-wrap" style="max-height:340px;overflow:auto"><table class="t"><thead><tr><th>#</th><th>Part</th><th>Level</th><th>Question</th><th>Options</th><th>Key</th></tr></thead><tbody>
      ${d.items.map((i, n) => `<tr><td class="num">${n + 1}</td><td>${i.strand}</td><td class="num">L${i.level}</td><td class="small">${i.passageTmp ? `<span class="muted">${esc(pmap[i.passageTmp].title)} ·</span> ` : ""}${esc(i.stem)}</td><td class="small">${i.options.map((o, k) => L(k) + ") " + esc(o)).join("<br>")}</td><td class="small">${i.answers.length ? i.answers.map(L).join(", ") : `<span class="chip crit">none</span>`}</td></tr>`).join("")}

      <label class="f">File<input type="file" id="imp-file" accept=".txt,.md,.docx,.csv,.json" onchange="T.readImport(this)"></label>
      <p id="imp-err" class="small" style="color:var(--crit)" hidden></p>
      <p class="small muted">CSV columns: <span class="kbd">strand, level, skill, passage_title, passage_text, question, a, b, c, d, e, answer, explanation, gap</span>. Put the passage text on the first row of each passage.</p></div>`;
  } else if (tab === "paste") {
    body = `<div class="stack" style="gap:12px"><label class="f">Paste questions and passages<textarea id="imp-text" rows="14" placeholder="${esc(FORMAT_GUIDE)}"></textarea></label>

      ${Array.from({ length: 6 }, (_, k) => `<div class="row" style="flex-wrap:nowrap"><label class="check" title="Correct"><input type="checkbox" name="ans" value="${k}" ${(it.answers || []).includes(k) ? "checked" : ""}><span class="kbd">${L(k)}</span></label><input type="text" id="if-o${k}" name="o${k}" value="${esc((it.options || [])[k] || "")}" placeholder="${k < 4 ? "Option " + L(k) : "Optional"}"><select name="mis${k}" title="If a student picks this wrong option, which misconception does it show?" style="max-width:250px;font-size:.8rem"><option value="">Misconception if chosen…</option>${[...new Set(Object.values(MIS).map(m => m.area))].map(ar => `<optgroup label="${esc(ar)}">${Object.entries(MIS).filter(([, m]) => m.area === ar).map(([c, m]) => `<option value="${c}" ${misMapOf(it)[k] === c ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</optgroup>`).join("")}</select></div>`).join("")}
      <p class="small muted">Tag each wrong option with the misunderstanding that makes it tempting. Students then get a targeted tip, and reports group errors by misconception. <a href="#" onclick="event.preventDefault();closeModal();T.tab('skills');setTimeout(()=>{const e=document.getElementById('mis-guide');e&&e.scrollIntoView()},50)">See the guide</a></p></div>
    <label class="f">Explanation shown after answering<textarea id="if-exp" name="explanation" rows="2" style="font-family:var(--f-body);font-size:.9rem">${esc(it.explanation || "")}</textarea></label>

}

        ${classes.map(c => `<div class="row between"><span><b>${esc(c.name)}</b> <span class="muted small">code <span class="num">${esc(c.code)}</span> · age ${c.chronAge || 10} · ${D.students(c.id).length} students</span></span><button class="btn ghost sm" onclick="T.classForm('${c.id}')">Edit</button></div>`).join("") || `<div class="empty small">No classes.</div>`}
      </section>
    </div>
    <section class="panel stack"><h3>Storage</h3>
      <p>${Store.mode === "firebase" ? `<span class="chip good"><span class="dot"></span>Connected to Firebase</span> Teachers and students on every device share one database.` : `<span class="chip"><span class="dot"></span>This device only</span> Everything is saved in this browser. Students must use this same device, or connect a shared database.`}</p>
      <details class="acc"><summary>Connect a shared database (Firebase)</summary><div class="stack">
        <p class="small">To run the class across many devices: create a free Firebase project, add a Web app, enable Cloud Firestore, then paste the config object below. Do this on every device, or paste the config into <span class="kbd">FIREBASE_CONFIG</span> at the top of the HTML file before you host it (this platform must be hosted on your own site or Netlify/GitHub Pages for the shared database to connect).</p>
        <p class="small muted">Answer keys travel with the data, so use Firestore security rules that suit your school.</p>
        <textarea id="fb-cfg" rows="6" placeholder='{ "apiKey": "…", "authDomain": "…", "projectId": "…", "appId": "…" }'>${cfg ? esc(JSON.stringify(cfg, null, 1)) : ""}</textarea>
        <div class="row"><button class="btn primary sm" onclick="T.saveFB()">Save and reconnect</button>${cfg ? `<button class="btn ghost sm" onclick="T.clearFB()">Disconnect</button>` : ""}</div></div></details>
      <div class="row"><button class="btn" onclick="T.backup()">Export backup (JSON)</button><label class="btn">Import backup<input type="file" id="bk-file" accept=".json" hidden onchange="T.restore(this)"></label>
        <button class="btn" onclick="T.demo(true)">Add demo class</button><button class="btn danger" onclick="T.wipe()">Erase all data</button></div>
    </section>
    <section class="panel stack"><h3>How the adaptive engine works</h3>
      <div class="grid g2 small">
        <div><h4>Start</h4><p class="muted">Each part starts at the level that matches the student's NGRT stanine for that part (SC or PC): stanine 1–2 → L1, 3 → L2, 4–5 → L3, 6–7 → L4, 8–9 → L5. Without a stanine, the reading age is compared with the class's typical age.</p></div>
        <div><h4>Move</h4><p class="muted">After every answer two checks run: a streak of fully correct (or incorrect) answers, and the average credit across the recent window. Either can move the level one step. Passages are chosen at the current level; all of a passage's questions are asked together.</p></div>
        <div><h4>Multi-answer</h4><p class="muted">Students are told how many answers to pick. Credit = (right picks − wrong picks) ÷ number of keys, never below zero. Only a perfect answer counts towards a correct streak.</p></div>

      </div></section>
  </div>`;
}
/* ================= TEACHER ACTIONS ================= */
const fd = f => { const o = {}; new FormData(f).forEach((v, k) => { if (k in o) { o[k] = [].concat(o[k], v); } else o[k] = v; }); return o; };
const arr = v => v == null ? [] : [].concat(v);
const T = {
  async setup(f) {
    const v = fd(f);
    Store.put("meta", { id: "teacher", name: v.name.trim(), username: v.username.trim().toLowerCase(), pinHash: await sha(v.pin) });
    Store.put("meta", Object.assign(D.settings(), { school: v.school.trim() }));
    const c = Store.put("classes", { id: uid("c"), name: v.cls.trim(), code: v.code.trim().toUpperCase(), chronAge: +v.age || 10, createdAt: Date.now() });
    ensureSeedBank();
    S.classId = c.id; ssSet("ngrt_cls", c.id); S.teacherOK = true; ssSet("ngrt_teacher", true); S.tab = "overview"; go("teacher");
    toast("Account created. A starter question bank has been added.");
  },
  async login(f) {
    const v = fd(f), t = D.teacher();
    if (t && v.username.trim().toLowerCase() === t.username && await sha(v.pin) === t.pinHash) { S.teacherOK = true; ssSet("ngrt_teacher", true); go("teacher"); }
    else { const e = $("#li-err"); e.hidden = false; }
  },
  logout() { S.teacherOK = false; ssSet("ngrt_teacher", null); go("landing"); },
  tab(k) { S.tab = k; ssSet("ngrt_tab", k); S.detail = null; S.asgDetail = null; render(); window.scrollTo(0, 0); },
  pickClass(id) { S.classId = id; ssSet("ngrt_cls", id); S.detail = null; S.asgDetail = null; S.profileFilter = null; render(); },
  openStudent(id) { S.tab = "students"; S.detail = id; render(); window.scrollTo(0, 0); },
  closeStudent() { S.detail = null; render(); },
  studentView(v) { S.studentView = v; S.profileFilter = null; render(); },
  planTick(id, key, on) { const s = D.student(id); s.plan = Object.assign({}, s.plan || {}); if (on) s.plan[key] = Date.now(); else delete s.plan[key]; Store.put("students", s); render(); },
  markWhy(attId, i, n) { const at = Store.get("attempts", attId); const r = at && at.sess.responses[i]; if (!r || !r.why) return; r.why.mark = n; Store.put("attempts", at); render(); },
  labAsgForm(id, pre) { const a = id ? Store.get("labasg", id) : Object.assign({ cases: [], target: { type: "class", ids: [] } }, pre || {}); openModal(labAsgFormHTML(a), true); },
  saveLabAsg(f, id) {
    const v = fd(f), err = $("#la-err"), cases = arr(v.cases);
    if (!cases.length) { err.textContent = "Choose at least one case."; err.hidden = false; return; }
    const tt = v.ttype, ids = tt === "groups" ? arr(v.tgroups) : tt === "profiles" ? arr(v.tprofiles) : tt === "students" ? arr(v.tstudents) : [];
    if (tt !== "class" && !ids.length) { err.textContent = "Choose who the cases are for."; err.hidden = false; return; }
    const old = id ? Store.get("labasg", id) : {};
    Store.put("labasg", Object.assign({}, old, { id: id || uid("l"), classId: S.classId, title: v.title.trim(), cases: LAB_CASES.map(c => c.id).filter(c => cases.includes(c)), target: { type: tt, ids }, due: v.due ? new Date(v.due + "T23:59").getTime() : null, note: (v.note || "").trim(), createdAt: old.createdAt || Date.now() }));
    closeModal(); render(); toast(id ? "Saved." : "Cases set. Students see them at the top of their wall.");
  },
  labAsgDel(id) { confirmBox("Remove these set cases?", "Students keep any work they have done. The cases simply stop being marked as set.", "Remove", () => { Store.del("labasg", id); render(); }); },
  labAsgProgress(id) { openModal(labAsgProgressHTML(Store.get("labasg", id)), true); },
  labByProfile() {
    const studs = D.students(S.classId), present = PROFILE_ORDER.filter(k => studs.some(s => profileKey(s.sc, s.pc) === k));
    if (!present.length) { toast("Enter SC and PC stanines first, so students have profiles."); return; }
    confirmBox("Set cases by NGRT profile?", `Each profile group gets the cases that fit its needs: ${present.map(k => `${PROFILES[k].name}: ${PROFILE_CASES[k].map(c => labCase(c).dept).join(" + ")}`).join("; ")}. You can edit or remove any of them afterwards.`, "Set cases", () => {
      present.forEach((k, i) => Store.put("labasg", { id: uid("l"), classId: S.classId, title: `${PROFILES[k].name} profile: ${PROFILES[k].headline.toLowerCase()}`, cases: PROFILE_CASES[k], target: { type: "profiles", ids: [k] }, due: null, note: "", createdAt: Date.now() + i }));
      render(); toast(`Cases set for ${present.length} profile group${present.length === 1 ? "" : "s"}.`); }, false);
  },
  planNote(id, v) { const s = D.student(id); s.planNotes = v; Store.put("students", s); toast("Notes saved."); },
  profileTest(k, ids) {
    const t = PROFILE_PLUS[k].test, names = ids.map(i => (D.student(i) || {}).name || "").filter(Boolean);
    const a = Object.assign({ strands: ["SC", "PC"], scCount: 10, pcPassages: 2, wrCount: 12, phonics: "auto", timeMode: "none", totalMin: 20, perQSec: 60, feedback: "each", attemptsAllowed: 0, startMode: "profile", fixedLevel: 3, adapt: Object.assign({}, DEFAULT_ADAPT), open: true, review: true }, t);
    delete a.why; a.title = t.title + (names.length === 1 ? " · " + names[0].split(" ")[0] : " · " + PROFILES[k].name + " group");
    a.target = { type: "students", ids }; openModal(asgFormHTML(a), true);
  },
  filterProfile(k) { S.profileFilter = k; S.tab = "students"; S.detail = null; render(); },
  openAsg(id) { S.tab = "assignments"; S.asgDetail = id; render(); window.scrollTo(0, 0); },
  closeAsg() { S.asgDetail = null; render(); },
  /* students */
  bulkAdd() {
    openModal(`<div class="row between"><h3>Add students to ${esc(D.cls(S.classId).name)}</h3><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
      <p class="muted small">One student per line: <span class="kbd">Name, reading age, SC, PC, group</span>. Reading age as years:months (<span class="kbd">9:06</span>). SC and PC accept a stanine (1–9) or an SAS (69–141). Only the name is required.</p>

  },
  editStudent(id) {
    const s = D.student(id);
    openModal(`<form class="stack" onsubmit="event.preventDefault();T.saveStudent(this,'${id}')">
      <div class="row between"><h3>Edit ${esc(s.name)}</h3><button type="button" class="btn ghost sm" onclick="closeModal()">Close</button></div>
      <div class="grid g2"><label class="f">Name<input type="text" id="es-name" name="name" required value="${esc(s.name)}"></label><label class="f">Group<input type="text" id="es-group" name="group" value="${esc(s.group || "")}" placeholder="e.g. Falcons"></label>
        <label class="f">NGRT reading age<span class="hint">years:months, e.g. 9:06. Students log in with this.</span><input type="text" id="es-ra" name="ra" value="${s.ra != null ? fmtRA(s.ra) : ""}"></label>
        <label class="f">Class<select id="es-cls" name="classId">${D.classes().map(c => `<option value="${c.id}" ${c.id === s.classId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></label>
        <label class="f">Sentence Completion<span class="hint">stanine 1–9 or SAS</span><input type="text" id="es-sc" name="sc" value="${s.scSAS || s.sc || ""}"></label>
        <label class="f">Passage Comprehension<span class="hint">stanine 1–9 or SAS</span><input type="text" id="es-pc" name="pc" value="${s.pcSAS || s.pc || ""}"></label></div>
      <label class="check"><input type="checkbox" name="confirm" checked>Mark reading age and scores as confirmed by the teacher</label>
      <div class="row between"><button type="button" class="btn danger" onclick="T.delStudent('${id}')">Remove student</button><span class="row"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save</button></span></div></form>`);
  },
  saveStudent(f, id) {
    const v = fd(f), s = D.student(id);
    s.name = v.name.trim(); s.group = v.group.trim(); s.classId = v.classId; s.ra = parseRA(v.ra);
    setScore(s, "sc", v.sc); setScore(s, "pc", v.pc);

  delStudent(id) { confirmBox("Remove this student?", "Their test history is deleted too. This cannot be undone.", "Remove", () => { D.attempts(a => a.studentId === id).forEach(a => Store.del("attempts", a.id)); Store.del("students", id); S.detail = null; render(); }); },
  /* assignments */
  asgForm(id) { const a = id ? D.asg(id) : { strands: ["SC", "PC"], adapt: Object.assign({}, DEFAULT_ADAPT), timeMode: "total", open: true }; openModal(asgFormHTML(a), true); },
  asgTarget(k) { $("#af-ttype-v").value = k; document.querySelectorAll("#af-ttype button").forEach((b, i) => b.classList.toggle("on", ["class", "groups", "profiles", "students"][i] === k)); document.querySelectorAll("[data-tpanel]").forEach(p => p.hidden = p.dataset.tpanel !== k); },
  saveAsg(f, id) {
    const v = fd(f), err = $("#af-err");
    const strands = arr(v.strands); if (!strands.length && v.phonics !== "only") { err.textContent = "Choose Sentence Completion, Passage Comprehension or both, or set the phonics route to Word reading only."; err.hidden = false; return; }
    const tt = v.ttype; const ids = tt === "groups" ? arr(v.tgroups) : tt === "profiles" ? arr(v.tprofiles) : tt === "students" ? arr(v.tstudents) : [];
    if (tt !== "class" && !ids.length) { err.textContent = "Choose at least one " + (tt === "groups" ? "group" : tt === "profiles" ? "profile" : "student") + "."; err.hidden = false; return; }

let CAL_CACHE = { key: null, val: { items: {}, passages: {} } }, CAL_VER = 0;

function calData() {

/* every pending suggestion, ignoring ones the teacher chose to keep */
function calSuggestions() {

  Store.all("items").forEach(i => { const x = c.items[i.id]; if (x && x.suggest && i.calKeep !== x.suggest) out.push({ kind: "item", id: i.id, title: i.stem, strand: i.strand, level: i.level, x }); });
  Store.all("passages").forEach(p => { const x = c.passages[p.id]; if (x && x.suggest && p.calKeep !== x.suggest) out.push({ kind: "passage", id: p.id, title: p.title, strand: "PC", level: p.level, x }); });
  return out.sort((a, b) => Math.abs(b.x.d - b.level) - Math.abs(a.x.d - a.level));
}
function applySuggestion(sug) {
  const now = Date.now();
  if (sug.kind === "item") {
    const it = D.item(sug.id); if (!it) return 0;
    if (!it.authorLevel) it.authorLevel = it.level;
    it.level = sug.x.suggest; it.calAppliedAt = now; delete it.calKeep;
    Store.put("items", it); return 1;
  }
  const p = D.passage(sug.id); if (!p) return 0;
  if (!p.authorLevel) p.authorLevel = p.level;
  p.level = sug.x.suggest; p.calAppliedAt = now; delete p.calKeep;
  Store.put("passages", p);
  const qs = Store.all("items").filter(i => i.passageId === p.id).map(i => Object.assign(i, { authorLevel: i.authorLevel || i.level, level: p.level }));
  if (qs.length) Store.putMany("items", qs);

}

function optionOrder(it, seed) {

    <div class="grid g2">

    </div>
    ${a.review !== false || isTeacherView ? `<section class="stack" style="gap:10px"><h2>Check your answers</h2>${at.sess.responses.map((r, i) => { const it = D.item(r.itemId); if (!it) return ""; return `<div class="panel stack" style="gap:8px;padding:16px"><div class="row between"><span class="small muted">Q${i + 1} · ${r.strand} · Level ${r.level} · ${esc(r.skill)}</span><span class="chip ${r.credit === 1 ? "good" : r.credit > 0 ? "warn" : "crit"}">${r.timedOut ? "Timed out" : r.credit === 1 ? "Correct" : r.credit > 0 ? "Partly correct" : "Incorrect"}</span></div>
      <p><b>${esc(it.stem)}</b></p><p class="small">You chose: <b>${r.chosen.length ? esc(r.chosen.map(c => it.options[c]).join(", ")) : "nothing"}</b>${r.credit < 1 ? ` · Answer: <b>${esc(it.answers.map(c => it.options[c]).join(", "))}</b>` : ""}</p>${it.explanation ? `<p class="small muted">${esc(it.explanation)}</p>` : ""}${misFeedbackHTML(r, it)}</div>`; }).join("")}</section>` : ""}
  </main>`;
}
const Cert = {

    return { name: s.name, title: a.title, date: fmtDate(at.finishedAt), award: sm.award, pct: sm.pct, sc: sm.strands.SC, pc: sm.strands.PC, wr: sm.strands.WR, school: st.school || "", teacher: t.name || "", cls: (D.cls(at.classId) || {}).name || "" };
  },
  colors: { gold: "#c99a1b", silver: "#8b95a7", bronze: "#b26b3b" },
  html(at) {
    const d = Cert.data(at), aw = AWARDS[d.award];
    return `<div class="cert" role="img" aria-label="Certificate for ${esc(d.name)}">

      <div class="c-row"><div class="c-medal" style="background:${Cert.colors[d.award]}">${aw.name.replace(" ", "<br>")}</div>
        ${d.wr ? `<div class="c-stat"><b>Level ${d.wr.final}</b><span>Word reading</span></div>` : ""}${d.sc ? `<div class="c-stat"><b>Level ${d.sc.final}</b><span>Sentence Completion</span></div>` : ""}${d.pc ? `<div class="c-stat"><b>Level ${d.pc.final}</b><span>Passage Comprehension</span></div>` : ""}<div class="c-stat"><b>${d.pct}%</b><span>Score</span></div></div>
      <div class="c-foot"><div>${esc(d.date)}</div><div>${esc(d.teacher || "Teacher")}</div></div></div>`;
  },
  async canvas(at) {
    const d = Cert.data(at), aw = AWARDS[d.award], W = 2000, H = 1414, c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");

    x.fillStyle = "#fffdf6"; x.fillRect(0, 0, W, H);
    x.strokeStyle = "#1a2238"; x.lineWidth = 34; x.strokeRect(17, 17, W - 34, H - 34);
    x.strokeStyle = "#c99a1b"; x.lineWidth = 5; x.strokeRect(60, 60, W - 120, H - 120);
    // highlighter stroke motif
    x.fillStyle = "rgba(255,217,74,.55)"; x.fillRect(W / 2 - 380, 330, 760, 34);
    x.textAlign = "center"; x.fillStyle = "#5d6478"; x.font = `500 30px ${mono}`;
    const eb = (d.school || "NGRT Reading Lab").toUpperCase() + (d.cls ? "  ·  " + d.cls.toUpperCase() : "");
    x.fillText(eb.split("").join(String.fromCharCode(8202)), W / 2, 210);
    x.fillStyle = "#1a2238"; x.font = `800 88px ${disp}`; x.fillText("Certificate of Reading Achievement", W / 2, 350);
    x.font = `400 38px ${body}`; x.fillStyle = "#3a4258"; x.fillText("This certifies that", W / 2, 470);
    let fs = 120; x.font = `700 ${fs}px ${disp}`; while (x.measureText(d.name).width > 1400 && fs > 60) { fs -= 6; x.font = `700 ${fs}px ${disp}`; }
    x.fillStyle = "#1a2238"; x.fillText(d.name, W / 2, 610);
    x.strokeStyle = "#c99a1b"; x.lineWidth = 4; x.beginPath(); x.moveTo(W / 2 - 520, 650); x.lineTo(W / 2 + 520, 650); x.stroke();
    x.font = `400 38px ${body}`; x.fillStyle = "#3a4258";
    x.fillText(`completed ${d.title}, an adaptive NGRT-style reading test,`, W / 2, 730); x.fillText("and earned the", W / 2, 785);
    const stats = [["medal"], ...(d.wr ? [["Level " + d.wr.final, "WORD READING"]] : []), ...(d.sc ? [["Level " + d.sc.final, "SENTENCE COMPLETION"]] : []), ...(d.pc ? [["Level " + d.pc.final, "PASSAGE COMPREHENSION"]] : []), [d.pct + "%", "SCORE"]];
    const gap = 420, x0 = W / 2 - gap * (stats.length - 1) / 2;
    stats.forEach((s, i) => { const cx = x0 + i * gap, cy = 960;
      if (s[0] === "medal") { x.fillStyle = Cert.colors[d.award]; x.beginPath(); x.arc(cx, cy, 120, 0, Math.PI * 2); x.fill(); x.strokeStyle = "rgba(255,255,255,.5)"; x.lineWidth = 10; x.beginPath(); x.arc(cx, cy, 104, 0, Math.PI * 2); x.stroke();
        x.fillStyle = "#fff"; x.font = `800 40px ${disp}`; const [w1, w2] = aw.name.split(" "); x.fillText(w1, cx, cy - 4); x.fillText(w2, cx, cy + 42); }
      else { x.fillStyle = "#1a2238"; x.font = `700 64px ${disp}`; x.fillText(s[0], cx, cy + 10); x.fillStyle = "#5d6478"; x.font = `500 24px ${mono}`; x.fillText(s[1], cx, cy + 60); } });
    x.strokeStyle = "#1a2238"; x.lineWidth = 2; x.font = `400 32px ${body}`; x.fillStyle = "#3a4258";

    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    saveFile(`${Cert.data(at).name.replace(/\W+/g, "-")}-reading-certificate.png`, blob, "image/png");
  },
  async print(id) {

    w.document.write(`<title>Certificate</title><style>@page{size:A4 landscape;margin:0}body{margin:0}img{width:100%;display:block}</style><img src="${c.toDataURL("image/png")}" onload="setTimeout(()=>print(),200)">`); w.document.close();
  }
};

/* ================= DEMO DATA ================= */
/* Demo only: some questions are secretly easier or harder than their written level, so calibration has something to find. */
function demoTrueLevel(it) {
  let h = 0; for (const ch of String(it.passageId || it.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const shift = [0, 0, 0, 0, 0, 0, 1.2, -1.2, 0.6, -0.6][h % 10];
  return it.level + shift;
}
async function buildDemo() {
  ensureSeedBank();
  if (!D.teacher()) Store.put("meta", { id: "teacher", name: "Ms Rivera", username: "teacher", pinHash: await sha("1234") });
  const st = D.settings(); if (!st.school) { st.school = "Demo Primary School"; Store.put("meta", st); }
  let code = "5B-READ", n = 1; while (D.classes().some(c => c.code === code)) code = "5B-READ" + (++n);
  const c = Store.put("classes", { id: uid("c"), name: n > 1 ? `5B Readers (${n})` : "5B Readers", code, chronAge: 10, createdAt: Date.now() - 864e6, demo: true });
  const roster = [["Aisha Rahman", "10:08", 6, 6, "Falcons"], ["Omar Haddad", "8:02", 2, 2, "Kingfishers"], ["Priya Nair", "11:04", 7, 8, "Falcons"], ["Lucas Ferreira", "9:01", 3, 5, "Kingfishers"],
    ["Hana Kim", "10:02", 5, 3, "Kingfishers"], ["Yusuf Ali", "9:10", 4, 6, "Falcons"], ["Mei Chen", "11:00", 7, 4, "Falcons"], ["Zayd Mansour", "10:05", 5, 7, "Falcons"],
    ["Sofia Rossi", "10:09", 7, 5, "Falcons"], ["Arjun Mehta", "9:08", 4, 5, "Kingfishers"], ["Leila Saeed", "9:06", 5, 4, "Kingfishers"], ["Noah Williams", "7:03", 1, 2, "Kingfishers"],
    ["Fatima Zahra", "12:01", 9, 8, "Falcons"], ["Ethan Brooks", "9:04", 4, 4, "Kingfishers"], ["Ravi Das", null, null, null, ""]];
  const studs = roster.map(([name, ra, sc, pc, group], i) => ({ id: uid("s"), classId: c.id, name, ra: parseRA(ra), raBy: ra ? "teacher" : undefined, sc, pc, scoresBy: sc ? (i === 10 ? "student" : "teacher") : undefined, group, createdAt: Date.now() - 864e6 }));
  Store.putMany("students", studs);
  const base = { classId: c.id, sets: [], startMode: "profile", fixedLevel: 3, adapt: Object.assign({}, DEFAULT_ADAPT), passMark: 60, showLevel: true, review: true, open: true };
  const a1 = Object.assign({}, base, { id: uid("a"), title: "Term 1 Adaptive Reading Check", target: { type: "class", ids: [] }, strands: ["SC", "PC"], scCount: 10, pcPassages: 2, timeMode: "total", totalMin: 30, perQSec: 60, feedback: "end", attemptsAllowed: 2, createdAt: Date.now() - 7 * 864e5 });
  const a2 = Object.assign({}, base, { id: uid("a"), title: "Word Power Sprint", target: { type: "profiles", ids: ["dhanesh", "michel", "kaia", "muhammed", "rhian"] }, strands: ["SC"], scCount: 8, pcPassages: 1, timeMode: "perQuestion", totalMin: 15, perQSec: 45, feedback: "each", attemptsAllowed: 0, createdAt: Date.now() - 3 * 864e5 });
  Store.putMany("assignments", [a1, a2]);
  const bank = D.bank(); const atts = [];
  const sim = (asg, s, daysAgo) => {
    const sess = newSession(asg, s, bank, c, Date.now() - daysAgo * 864e5);
    const abil = { SC: levelFromStanine(s.sc) + (Math.random() - 0.4) * 0.8, PC: levelFromStanine(s.pc) + (Math.random() - 0.4) * 0.8, WR: levelFromStanine(s.sc) + 1.2 + Math.random() * 0.8 };
    let t = sess.startedAt, id;
    while ((id = nextItem(sess, asg, bank))) {
      const it = bank.items.find(i => i.id === id); const p = 1 / (1 + Math.exp(-1.7 * (abil[it.strand] - demoTrueLevel(it) + 0.4)));
      let ch; if (Math.random() < p) ch = it.answers.slice(); else if (it.answers.length > 1 && Math.random() < 0.6) ch = [it.answers[0], it.options.findIndex((_, k) => !it.answers.includes(k))]; else { const w = it.options.map((_, k) => k).filter(k => !it.answers.includes(k)); ch = it.answers.length > 1 ? w.slice(0, it.answers.length) : [w[Math.floor(Math.random() * w.length)]]; }
      const ms = 9000 + Math.random() * (it.strand === "PC" ? 50000 : 25000); t += ms;
      answerItem(sess, asg, it, ch, ms); sess.current = null;
    }

    atts.push({ id: uid("t"), asgId: asg.id, studentId: s.id, classId: c.id, status: "complete", startedAt: sess.startedAt, finishedAt: t, sess, summary: summarise(sess, asg) });
  };

}
